<!DOCTYPE html>
<html lang="la">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARIANE — Fābulae Latīnae</title>
  <meta name="description" content="Disce linguam Latīnam per fābulās illūstrātās — mēthodo nātūrālī, sine ūllā linguā aliā.">
  <meta property="og:title" content="MARIANE — Fābulae Latīnae">
  <meta property="og:description" content="Latin through illustrated fables, 100% in Latin. Natural method, fully gamified.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2b1c16">
  <base href="/imarianus/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Load order is FIXED and matters (all defer ⇒ executed in document order):
       storage/api/audio/tts are leaf utilities; scenes draws; data-core defines
       DATA (UI strings + config); manifest defines CONTENT_MANIFEST, which
       content-loader reads at definition time; app.js runs last and uses all
       of them. Content files themselves are NOT listed here — content-loader
       injects content/<track>-<region>.js on demand. -->
  <script src="js/storage.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/tts.js" defer></script>
  <script src="js/scenes.js" defer></script>
  <!-- Art library (M2). These register extra actors/backgrounds INTO scenes.js.
       They are optional by construction: every caller feature-detects with
       Scenes.actorNames(), so a missing file degrades to placeholder art
       instead of breaking a screen. -->
  <script src="js/actors-person.js" defer></script>
  <script src="js/actors-props.js" defer></script>
  <script src="js/backgrounds2.js" defer></script>
  <script src="js/data-core.js" defer></script>
  <script src="content/manifest.js" defer></script>
  <script src="js/content-loader.js" defer></script>
  <script src="js/auth-ui.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/boss.js" defer></script>
  <!-- M3 phase engine. boss.js is the ENGINE and the registry; these two fill
       the registry and must therefore load after it. boss-phases.js registers
       the Fabulae duel rounds (caterva/clamor/fuga); probatio.js builds a
       second engine instance for the non-combat Historia/Aeneis trials.
       boss-phases.js is REQUIRED, not optional: with no phase registered the
       engine has nothing to play, and it reports a LOSS rather than handing
       out a free unlock (see the guard in Boss.start). probatio.js is genuinely
       optional — a page without it simply has no trials. -->
  <script src="js/boss-phases.js" defer></script>
  <script src="js/probatio.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header id="topbar"></header>
  <main id="app" class="screen">
    <noscript><p>Ad lūdendum, JavaScript necessārium est.</p></noscript>
  </main>
</body>
</html>
