<!DOCTYPE html>
<!-- ============================================================
     tests/qa.html — headless visual-QA harness (NOT deployed)
     ------------------------------------------------------------
     Loads the real app WITHOUT js/api.js, so app.js takes its
     local-only branch (no backend needed). An inline script seeds
     localStorage BEFORE storage.js runs, then auto-navigates to
     the screen named in the query string:

        qa.html?screen=landing   logged-out landing page
        qa.html?screen=doors     the three doors (home)
        qa.html?screen=historia  the Historia Sacra map (Liber I)
        qa.html?screen=mox       NO TRACK REACHES THIS SCREEN ANY MORE. The
                                 MOX screen is what a door with an empty
                                 `regions` array opens, and as of the AL1/AL2
                                 registration all three tracks ship content:
                                 Fabulae r01-r12, Historia l1-l8, Aeneis
                                 al1-al2. Historia stopped reaching it at the
                                 L1/L2 registration and Aeneis has now
                                 followed. The route below still opens the
                                 Aeneis door, which lands on the al1 MAP; it
                                 is kept so the URL does not 404, and it warns
                                 in the console. Re-point it at the next
                                 track that is added empty.
        qa.html?screen=ordo      leaderboard (empty-board state)
        qa.html?screen=map       the overworld board
        qa.html?screen=cap       capitulum step list (f2)
        qa.html?screen=verba     first step running
        qa.html?screen=fabula    story page + autoplay controls
        qa.html?screen=sonus     listen-and-pick-the-picture
        qa.html?screen=comple    complete-the-sentence
        qa.html?screen=bossintro the boss intro card (actor + challenge)
        qa.html?screen=boss      the M3 three-phase duel
        qa.html?screen=probatio  the non-combat trial engine
        qa.html?screen=bosswin   WIN the region's boss and pass its quiz,
                                 landing on the victory screen — the only
                                 way a headless run reaches the NAV
                                 auto-advance (mapNode moves to the next
                                 region). Pair with &region=.

     Region knob (works with every screen above):
        &region=r02              stand the learner IN that region: every
                                 capitulum before it is seeded done and the
                                 saved map node is its first capitulum, so
                                 the door resumes there and the continuous
                                 board opens scrolled to that segment.
                                 (It used to rotate the region to the front
                                 of the manifest, which was the only way in
                                 when the app rendered one region and had no
                                 navigation. The board now draws the whole
                                 track, so rotating it would DESTROY the
                                 thing under test — the region order.)
        &track=historia          which DOOR the route walks through. Defaults
                                 to fabulae, and to historia when the screen
                                 or the region id is a Historia one. The step
                                 routes open h1 on that track instead of f2.
                                 e.g. &screen=fabula&track=historia   → h1
                                      &screen=bossintro&region=l2     → Arca

     Extra knobs:
        &cap=f16                 photograph a NAMED capitulum instead of the
                                 region's first (works with every step
                                 screen; seeds everything before it as done)
        &page=3                  once a FĀBULA is running, tap 'perge' this
                                 many times — the only way a headless shot
                                 reaches story page N
                                 e.g. &screen=fabula&region=r03&cap=f7&page=2
        &phase=caterva|clamor|fuga          (screen=boss)
        &phase=ordina|transitus|sententia   (screen=probatio)
                                 Restarts the engine on the same
                                 canvas with ONE phase, so a
                                 headless screenshot can reach a
                                 phase it cannot play its way to.
                                 Without it, screen=boss runs the
                                 real three-phase fight (useful for
                                 catching the interstitial card at
                                 about t=0.6 s).
        &w=360                   nothing to do with layout; recorded
                                 in the title so a screenshot is
                                 self-identifying
        &scroll=1|top|mid|bottom park the board at a named scroll position
                                 instead of auto-centring on the current
                                 node. `1` and `top` are the summit (the
                                 last region's boss); `bottom` is the foot
                                 of regiō I. A continuous board is 6–7k CSS
                                 pixels tall, so one shot cannot show it.
        &index=1                 open the REGIŌNĒS index over the board

     Screenshot with:
        chrome --headless=new --hide-scrollbars --screenshot=out.png \
               --window-size=375,812 --virtual-time-budget=9000 URL

     NOTE ON CLICKS: map nodes are SVG <g> elements. SVGElement has no
     .click() in every engine, so this harness dispatches a real
     MouseEvent instead — the same thing a finger does.
     ============================================================ -->
<html lang="la">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA — MARIANE</title>
  <base href="/">
  <link rel="stylesheet" href="css/styles.css">
  <!-- The manifest loads SYNCHRONOUSLY, ahead of the seed below, because the
       seed needs to know which capitula exist. A classic <script> in <head>
       runs during parsing and therefore before every deferred script, so
       CONTENT_MANIFEST is defined by the time the seed runs and content-loader
       (deferred, further down) still finds it exactly where it expects. This
       is the ONLY copy: the deferred one was removed, or the file would be
       evaluated twice. -->
  <script src="content/manifest.js"></script>
  <script>
    /* seed BEFORE storage.js loads: a mid-progress student */
    (function () {
      var q = location.search;
      window.__QA_SCREEN = (q.match(/screen=([a-z]+)/) || [])[1] || 'doors';
      window.__QA_SCROLL = (q.match(/scroll=([a-z0-9]+)/) || [])[1] || '';
      window.__QA_INDEX = /index=1/.test(q);
      window.__QA_PHASE = (q.match(/phase=([a-z]+)/) || [])[1] || '';
      window.__QA_REGION = (q.match(/region=([a-z0-9]+)/) || [])[1] || '';
      /* &cap=f16 — photograph a NAMED capitulum instead of the region's
         first one, and &page=N tap 'perge' N times once its FĀBULA is
         running, so a headless shot can reach a named story page. Without
         &cap= every route below behaves exactly as it did before. */
      window.__QA_CAP = (q.match(/cap=([a-z0-9]+)/) || [])[1] || '';
      window.__QA_PAGE = parseInt((q.match(/page=([0-9]+)/) || [])[1] || '0', 10);

      /* &play=N — PLAY N MOVES OF THE MEMORY BOARD before the shutter opens.
         A board with every card face-down photographs the card SIZE but not
         the thing the owner asked about: whether two revealed pictures can be
         told apart. The route below taps N face-down cards, one every 400ms,
         through the real click handlers — matched pairs stay face-up, so the
         shot shows a genuine mid-game board. With &rand= the shuffle is
         deterministic, so the same URL yields the same board every time. */
      window.__QA_PLAY = parseInt((q.match(/play=([0-9]+)/) || [])[1] || '0', 10);

      /* &rand=N — REPLACE Math.random WITH A SEEDED SEQUENCE.
         The VERBA quick check, SONUS and AENIGMATA all shuffle, so "the
         question about Adam" is not a URL anyone can write: which word is
         asked, and which two distractors stand beside it, is a coin toss on
         every load. A screenshot of a coin toss cannot be compared with
         another screenshot of a coin toss, so before/after shots of one
         option set were impossible to take honestly.
         With the knob the whole run is a pure function of N: the same URL
         photographs the same question every time, on any machine. Only this
         harness ever does it — nothing in js/ is touched, and without the
         knob Math.random is left exactly as the browser shipped it. */
      window.__QA_RAND = (q.match(/rand=([0-9]+)/) || [])[1] || '';
      if (window.__QA_RAND) {
        (function (seed) {
          var s = (parseInt(seed, 10) || 1) >>> 0;
          Math.random = function () {
            s = (s * 1664525 + 1013904223) >>> 0;
            return s / 4294967296;
          };
        }(window.__QA_RAND));
      }

      /* &legacy=1 — RENDER THE WAY THE APP DID BEFORE THE CLAR PASS.
         The "before" half of a before/after pair has to be the real app on
         the real content, not a mock-up and not a git checkout: the two shots
         differ only in the three things the pass changed. So this knob puts
         all three back — chips draw whole mini-scenes instead of cropped
         actors, picture rows lose the phone grid, and no question is ever
         flipped to picture→word. It is applied in the route script below,
         after js/chip-lint.js has loaded. */
      window.__QA_LEGACY = /legacy=1/.test(q);
      /* which DOOR the route walks through. Explicit &track= wins; otherwise
         the region id implies it. Test `al…` BEFORE `l…`: the Aeneis ids are
         al1/al2 (rules.php keys regions in one flat namespace, so they cannot
         be l1/l2 — those are Historia's), and /^l[0-9]/ does not match them
         but a careless /l[0-9]/ would. */
      window.__QA_TRACK = (q.match(/track=([a-z]+)/) || [])[1] ||
        (/^al[0-9]/.test(window.__QA_REGION) ? 'aeneis'
          : ((window.__QA_SCREEN === 'historia' || /^l[0-9]/.test(window.__QA_REGION))
            ? 'historia' : 'fabulae'));

      /* f1 finished, f2 in progress. A step is only reachable when the one
         before it is done, so unlock f2 UP TO whichever step was asked for —
         otherwise ?screen=comple just lands on the capitulum screen with a
         padlock, which is what happened the first time. */
      var ORDER = ['verba', 'fabula', 'sonus', 'ludus', 'aenigmata', 'corrige', 'comple'];
      var f2 = {};
      var want = ORDER.indexOf(window.__QA_SCREEN);
      var upTo = (want < 0) ? 2 : want;        /* default: verba + fabula done */
      for (var i = 0; i < upTo; i++) { f2[ORDER[i]] = 1; }

      var DONE = { verba: 1, fabula: 1, sonus: 1, ludus: 1, aenigmata: 1, corrige: 1, comple: 1 };
      var state = {
        name: 'Quintus', nickname: 'Quintus', avatar: 'fox',
        xp: 220, hearts: 4, maxHearts: 5,
        streak: 3, lastDay: new Date().toISOString().slice(0, 10),
        completed: {
          f1: DONE,
          f2: f2,
          /* the same partial unlock on Historia's first capitulum, so
             &track=historia reaches h1's steps by the identical route */
          h1: f2
        },
        bosses: {}, mapNode: 'f2',
        createdAt: 1700000000000
      };
      /* EVERY capitulum the manifest declares, marked done.

         The boss node only opens once every capitulum of its region is
         finished, so the boss/probatio/bossintro routes and the &cap= knob
         both need an "everything is done" map. That map used to be three
         hand-written ranges (f1–f18, h1–h22, …) which went stale the moment a
         wave registered a new region: f19+ and the whole Aeneis track were
         missing, so their boss nodes stayed locked and the screenshot showed a
         padlock instead of the boss. It is now READ OFF THE MANIFEST — the
         same list the app itself walks — which is why manifest.js is loaded
         above this script. A new region needs no edit here, ever.

         (l1 still has no boss at all, which is the point of the Historia map
         shot: finishing it must NOT grow a crown.) */
      function allCapsDone() {
        var out = {};
        var tracks = (window.CONTENT_MANIFEST && CONTENT_MANIFEST.tracks) || [];
        var ti, ri, ci, regs, caps;
        for (ti = 0; ti < tracks.length; ti++) {
          regs = tracks[ti].regions || [];
          for (ri = 0; ri < regs.length; ri++) {
            caps = regs[ri].capitula || [];
            for (ci = 0; ci < caps.length; ci++) { out[caps[ci]] = DONE; }
          }
        }
        if (window.console && !tracks.length) {
          console.warn('qa.html: CONTENT_MANIFEST is empty or absent — the ' +
            '"everything done" seed is empty and every boss node will be shut.');
        }
        return out;
      }

      /* Where does a node live? The app asks CONTENT.locate() the same
         question; the seed runs before content-loader exists, so it walks
         the manifest itself. */
      function locate(nodeId) {
        var tracks = (window.CONTENT_MANIFEST && CONTENT_MANIFEST.tracks) || [];
        var ti, ri, ci, regs, caps;
        for (ti = 0; ti < tracks.length; ti++) {
          regs = tracks[ti].regions || [];
          for (ri = 0; ri < regs.length; ri++) {
            caps = regs[ri].capitula || [];
            for (ci = 0; ci < caps.length; ci++) {
              if (caps[ci] === nodeId) {
                return { track: tracks[ti].id, region: regs[ri].id };
              }
            }
            if (regs[ri].boss === nodeId) {
              return { track: tracks[ti].id, region: regs[ri].id };
            }
          }
        }
        return null;
      }
      /* every capitulum of a track BEFORE the named region, plus that
         region's own capitula. THE UNLOCK RULE IS NOW CROSS-REGION (it
         always was on the server: lib/progress.php gates a step on the
         previous capitulum IN THE SAME TRACK), so seeding "open r05"
         means finishing f1–f12, not rotating r05 to the front. */
      function regionSeed(regionId) {
        var tracks = (window.CONTENT_MANIFEST && CONTENT_MANIFEST.tracks) || [];
        var ti, ri, ci, regs, caps, before = [];
        for (ti = 0; ti < tracks.length; ti++) {
          regs = tracks[ti].regions || [];
          before = [];
          for (ri = 0; ri < regs.length; ri++) {
            caps = regs[ri].capitula || [];
            if (regs[ri].id === regionId) {
              return { track: tracks[ti].id, before: before, caps: caps };
            }
            for (ci = 0; ci < caps.length; ci++) { before.push(caps[ci]); }
          }
        }
        return null;
      }

      if (window.__QA_SCREEN === 'boss' || window.__QA_SCREEN === 'probatio' ||
          window.__QA_SCREEN === 'bossintro' || window.__QA_SCREEN === 'bosswin') {
        state.completed = allCapsDone();
        state.mapNode = 'b_' + (window.__QA_REGION || 'r01');
      } else if (window.__QA_REGION) {
        /* stand the learner at the foot of the named region */
        var seed = regionSeed(window.__QA_REGION);
        if (seed) {
          var comp = {}, k;
          for (k = 0; k < seed.before.length; k++) { comp[seed.before[k]] = DONE; }
          if (seed.caps.length) {
            comp[seed.caps[0]] = f2;
            state.mapNode = seed.caps[0];
            window.__QA_FIRSTCAP = seed.caps[0];   /* the step routes' target */
          }
          state.completed = comp;
          window.__QA_TRACK = seed.track;      /* the region names its track */
        } else if (window.console) {
          console.warn('qa.html: &region=' + window.__QA_REGION + ' is not in the manifest');
        }
      }
      /* &cap=X: everything before X is finished and X itself is unlocked up
         to the step being photographed — the same shape the default seed
         gives f2, just moved. Only applies when the knob is used. */
      if (window.__QA_CAP) {
        var all = allCapsDone();
        all[window.__QA_CAP] = f2;
        state.completed = all;
        state.mapNode = window.__QA_CAP;
        var cloc = locate(window.__QA_CAP);
        if (cloc) { window.__QA_TRACK = cloc.track; }
      }
      /* the landing screen is the LOGGED-OUT route: no cached name, and a
         stub Api whose me() fails, which is exactly what a visitor with no
         session looks like to app.js. (api.js itself is never loaded here.) */
      if (window.__QA_SCREEN === 'landing') {
        try { localStorage.removeItem('mariane_cache_v2'); } catch (e) {}
        window.Api = {
          setCsrf: function () {}, getCsrf: function () { return ''; },
          me: function (cb) { setTimeout(function () { cb({ status: 401 }, null); }, 10); },
          login: function (u, p, r, cb) { cb({ status: 401 }, null); },
          register: function (p, cb) { cb({ status: 400 }, null); },
          logout: function (cb) { cb(null, { ok: true }); },
          completeStep: function (f, s, sc, cb) { cb({ status: 401 }, null); },
          bossFight: function (r, cb) { cb({ status: 401 }, null); },
          bossQuiz: function (r, a, cb) { cb({ status: 401 }, null); },
          sync: function (p, cb) { if (cb) { cb(null, {}); } }
        };
      } else {
        try { localStorage.setItem('mariane_cache_v2', JSON.stringify(state)); } catch (e) {}
      }
    })();
  </script>
  <script src="js/storage.js" defer></script>
  <!-- js/api.js deliberately ABSENT: forces the local-only branch -->
  <script src="js/audio.js" defer></script>
  <script src="js/tts.js" defer></script>
  <script src="js/scenes.js" defer></script>
  <script src="js/actors-person.js" defer></script>
  <script src="js/actors-props.js" defer></script>
  <script src="js/backgrounds2.js" defer></script>
  <script src="js/data-core.js" defer></script>
  <!-- content/manifest.js is loaded ABOVE, before the seed script -->
  <script src="js/content-loader.js" defer></script>
  <script src="js/chip-lint.js" defer></script>
  <script src="js/auth-ui.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/boss.js" defer></script>
  <script src="js/boss-phases.js" defer></script>
  <script src="js/probatio.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/app.js" defer></script>
  <script>
    /* Auto-navigate by driving the REAL UI — no test hooks inside app.js.
       Every step waits on the element it needs instead of a fixed delay, so
       the harness survives content loading on a slow machine. */
    window.addEventListener('load', function () {
      var target = window.__QA_SCREEN;

      /* &legacy=1 (see the knob block in <head>): undo the three CLAR changes
         so the "before" shot is this app on this content, one commit's worth
         of behaviour older. `soloActor` returning null sends every chip back
         through the whole-scene raster; `optionAmbiguous` returning null
         means no question ever flips; and the class sweep takes the phone
         grid off the picture rows, which app.js re-adds on every render — so
         it runs on an interval rather than once. */
      if (window.__QA_LEGACY && window.CHIP) {
        CHIP.soloActor = function () { return null; };
        CHIP.optionAmbiguous = function () { return null; };
        /* LUDUS adds a fourth thing to undo: the CANVAS crop rule, which the
           lūdus falling tiles and the boss tiles both reach through
           Scenes.tileImage. Pointing it straight at the raster puts every
           tile back on its whole 400x240 mini-scene, which is what the
           minigame did before this pass. (The tile SIZE is not undone — it is
           computed from the live canvas width — so a before/after pair of
           ludus shots shows the crop, and the size is asserted by the
           'at least 56 CSS px' row in tests/regression.html.) */
        if (window.Scenes && Scenes.tileImage) {
          Scenes.tileImage = function (word, px) { return Scenes.sceneImage(word, px); };
        }
        /* ?screen=ludus&legacy=1 goes one step further and repaints the
           falling items EXACTLY as js/game.js used to: a bare 56-unit image
           off a 60px raster, no tile, no frame, no size-for-the-screen. That
           is the honest "before" for the lūdus pair — same app, same content,
           one commit's worth of rendering. Scoped to the lūdus route so a
           legacy BOSS shot still shows the boss's own tiles. */
        if (window.Scenes && window.__QA_SCREEN === 'ludus') {
          Scenes.drawTile = function (ctx, word, cx, cy) {
            var img = Scenes.sceneImage(word, 60);
            if (img && img.complete && img.naturalWidth > 0) {
              ctx.drawImage(img, cx - 28, cy - 28, 56, 56);
            } else if (word && word.emoji) {
              ctx.font = '38px serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#3a2417';
              ctx.fillText(word.emoji, cx, cy);
            }
          };
        }
        window.setInterval(function () {
          var rows = document.querySelectorAll('.opt-row.picks'), i;
          for (i = 0; i < rows.length; i++) { rows[i].className = 'opt-row'; }
        }, 120);
      }

      /* &region= NO LONGER TOUCHES THE MANIFEST. It used to rotate the
         wanted region to the front of its track, because the app opened a
         track at its first region and had no navigation at all. The board
         is one continuous track now and the region ORDER is part of what a
         screenshot has to prove, so the knob works entirely through the
         seed above (progress + saved map node) and the app's own resume
         path. Nothing here mutates content. */

      /* Headless Chrome renders roughly one frame a second, so a canvas game
         driven by requestAnimationFrame is still on its first frame when the
         screenshot is taken. Both engines expose their frame source for this
         (see js/boss.js); a 16 ms timer gives the harness a real fight to
         photograph. Only the QA page does this — the app never does. */
      (function () {
        /* window.Game is the LŪDUS fox-catcher. It was missing from this list
           until the LUDUS pass, so every ?screen=ludus screenshot ever taken
           was of the game's FIRST FRAME — an empty field — which is precisely
           why the falling tiles went unaudited for so long. */
        var engines = [window.Boss, window.Probatio, window.Game], i;
        for (i = 0; i < engines.length; i++) {
          if (!engines[i] || !engines[i].setFrameSource) { continue; }
          engines[i].setFrameSource(
            function (fn) {
              return window.setTimeout(function () {
                fn((window.performance && window.performance.now)
                  ? window.performance.now() : new Date().getTime());
              }, 16);
            },
            function (id) { window.clearTimeout(id); }
          );
        }
      }());

      if (target === 'doors' || target === 'landing') { return; }

      /* poll for a selector, then run fn(el) */
      function when(sel, fn, tries) {
        tries = tries || 60;
        var el = document.querySelector(sel);
        if (el) { fn(el); return; }
        if (tries <= 0) { return; }
        setTimeout(function () { when(sel, fn, tries - 1); }, 100);
      }
      function tap(el) {
        /* works for both HTML buttons and SVG <g> nodes */
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      }
      /* the step button whose visible label matches this Latin name */
      function stepButton(label) {
        var all = [].slice.call(document.querySelectorAll('.steps button.node'));
        for (var i = 0; i < all.length; i++) {
          var lab = all[i].querySelector('.node-label');
          if (lab && lab.textContent === label) { return all[i]; }
        }
        return null;
      }

      var STEP_LABEL = {
        verba: 'Verba', fabula: 'Fābula', sonus: 'Sonus', ludus: 'Lūdus',
        aenigmata: 'Aenigmata', corrige: 'Corrige', comple: 'Complē'
      };

      /* the door this run walks through, and the capitulum its step routes
         open behind it. One pair of variables is the whole multi-track
         change: every route below was already track-shaped, it just had
         'fabulae' spelled into it. */
      var DOOR = '.door-' + window.__QA_TRACK;
      var FIRST_CAP = window.__QA_CAP || window.__QA_FIRSTCAP ||
        ((window.__QA_TRACK === 'historia') ? 'h1'
          : (window.__QA_TRACK === 'aeneis') ? 'a1' : 'f2');

      /* THERE IS NO LONGER AN EMPTY TRACK. Historia stopped being one at the
         L1/L2 registration and Aeneis stopped at AL1/AL2, so nothing in
         content/manifest.js opens the MOX screen any more. The route is kept
         (a QA URL that 404s is worse than one that lands somewhere sensible)
         but it now reaches the Aeneis MAP, not MOX, and it says so rather
         than letting a screenshot be quietly mislabelled. */
      if (target === 'mox') {
        if (window.console && console.warn) {
          console.warn('qa.html?screen=mox: no track has an empty `regions` ' +
            'array any more — every door is live. This opens the AENEIS MAP ' +
            '(al1), not the MOX screen. Re-point this route when a track is ' +
            'next added empty.');
        }
        when('.door-aeneis', tap);
        return;
      }
      /* the Historia map itself: open the door and stop there */
      if (target === 'historia') {
        when('.door-historia', tap);
        return;
      }
      if (target === 'ordo') {
        when('.nav-ordo', tap);
        return;
      }

      /* ---- M3: the boss duel and the probatio trials ----
         Both live behind the boss node, so the route is the same; only what
         we do once the canvas exists differs. `&phase=` restarts whichever
         engine on the SAME canvas with a single phase, which is the only way
         a headless screenshot can reach phase II or III of a fight it cannot
         play. Everything it passes is what app.js passes in real life. */
      function bossConfig(extra) {
        var rid = window.__QA_REGION || 'r01';
        var reg = window.CONTENT ? CONTENT.region(window.__QA_TRACK, rid) : null;
        var boss = (reg && reg.boss) || {};
        var words = [], seen = {}, i, j, v;
        var caps = (reg && reg.capitula) || [];
        for (i = 0; i < caps.length; i++) {
          v = caps[i].vocab || [];
          for (j = 0; j < v.length; j++) {
            if ((v[j].emoji || v[j].scene) && !seen[v[j].la]) {
              seen[v[j].la] = true;
              words.push(v[j]);
            }
          }
        }
        var cfg = {
          words: words, capitula: caps,
          region: boss.progressId || 'region1',
          regionIndex: (rid === 'r01') ? 0 : 1,
          name: boss.name || 'Lupus',
          actor: boss.actor || 'wolf',
          actorPose: boss.fightPose || (boss.actor === 'leo' ? 'stand' : 'angry'),
          avatar: 'fox'
        };
        for (var k in extra) {
          if (Object.prototype.hasOwnProperty.call(extra, k)) { cfg[k] = extra[k]; }
        }
        return cfg;
      }

      /* screen=probatio rewrites Regiō I's boss INTO a trial, in memory, the
         moment its content file has registered. That matters: the harness used
         to reach a trial by starting the Probatio engine itself, which meant
         app.js's own probatio wiring was never exercised and the screen kept
         the DUEL's header — a trial captioned "Lupum vince!". Everything the
         screenshot shows now comes from app.js: the header string, the intro
         glyph, and the choice of engine. Real Historia trials will arrive with
         their own content; this keeps the route testable until they do —
         and it is now SKIPPED on the historia track, whose Liber II ships a
         real probatio (b_l2 'Arca') that must be photographed as authored. */
      function asTrial(rid) {
        var reg = window.CONTENT ? CONTENT.region('fabulae', rid) : null;
        if (!reg || !reg.boss) { return; }
        reg.boss.kind = 'probatio';
        reg.boss.name = 'Silva';
        /* 90 s and 9 hp so the phase cannot end under the camera */
        reg.boss.phases = [
          { type: window.__QA_PHASE || 'ordina', hp: 9, seconds: 90 }
        ];
      }

      /* ---- screen=bosswin — THE AUTO-ADVANCE, END TO END ----
         NAV's second half is what happens AFTER a boss falls: app.js must
         move the saved map node onto the first capitulum of the NEXT
         region, so the board reopens on the new segment instead of on a
         summit with no road off it. That path starts in Boss.onEnd and runs
         through the quiz, and neither can be reached by a headless
         screenshot playing a canvas game for real.

         So the harness WINS THE FIGHT for it, through the public API only:
         Boss.start is wrapped so it reports an immediate victory with a
         plausible payload, and the quiz is then answered correctly (the
         right option is the one whose data-la is the prompt word). Every
         line of app.js after that — the mirror update, runBossQuiz,
         showBossResult, advanceAfterBoss — is the real thing. Nothing in
         js/ has a test hook. */
      if (target === 'bosswin') {
        var wrid = window.__QA_REGION || 'r01';
        if (window.Boss && Boss.start) {
          var realStart = Boss.start;
          Boss.start = function (canvas, cfg, handlers) {
            window.setTimeout(function () {
              if (handlers && handlers.onEnd) {
                handlers.onEnd(true, { region: cfg.region, ms: 45000, mistakes: 1, phases: [] });
              }
            }, 60);
          };
          Boss.start.real = realStart;
        }
        /* answer every quiz question with the option that matches the word */
        function answerQuiz() {
          var prompt = document.querySelector('.prompt-word');
          if (!prompt) {
            if (document.querySelector('.finis')) { return; }   /* done */
            window.setTimeout(answerQuiz, 120);
            return;
          }
          var word = String(prompt.textContent).replace(/🔊/g, '').replace(/^\s+|\s+$/g, '');
          var opts = [].slice.call(document.querySelectorAll('.emoji-opt')), i;
          for (i = 0; i < opts.length; i++) {
            if (opts[i].getAttribute('data-la') === word) { tap(opts[i]); break; }
          }
          window.setTimeout(answerQuiz, 220);
        }
        when(DOOR, function (door) {
          tap(door);
          when('.map-node[data-id="b_' + wrid + '"]', function (node) {
            tap(node);
            when('#fight', function (btn) { tap(btn); answerQuiz(); });
          });
        });
        return;
      }

      if (target === 'boss' || target === 'probatio' || target === 'bossintro') {
        var rid = window.__QA_REGION || 'r01';
        /* the boss node id is per-region content (b_r01, b_r02, …) */
        var bossNode = '.map-node[data-id="b_' + rid + '"]';
        when(DOOR, function (door) {
          tap(door);
          when(bossNode, function (node) {
            /* the region's content file is registered by the time its map
               node exists, so this is the first safe moment to retune it */
            if (target === 'probatio' && window.__QA_TRACK === 'fabulae') {
              asTrial(rid);
            }
            tap(node);
            /* screen=bossintro stops HERE: the intro screen is where the
               boss's own actor and challenge line are on show. */
            if (target === 'bossintro') { return; }
            when('#fight', function (btn) {
              tap(btn);
              /* A trial now needs no help — app.js starts the right engine
                 with the phase asTrial() wrote. screen=boss with no &phase=
                 runs the REAL three-phase duel; with one, the duel engine is
                 restarted on the same canvas with that single phase, which is
                 the only way a headless shot can reach round II or III. */
              if (target === 'probatio' || !window.__QA_PHASE) { return; }
              when('#bossgame', function (cv) {
                if (!window.Boss) { return; }
                Boss.start(cv, bossConfig({
                  phases: [{ type: window.__QA_PHASE, hp: 9, seconds: 90 }]
                }), { onEnd: function () {} });
              });
            });
          });
        });
        return;
      }

      /* everything else lives behind the track's door */
      when(DOOR, function (door) {
        tap(door);
        when('.map-view', function (view) {
          if (target === 'map') {
            /* &long=1 renders a SYNTHETIC 12-capitulum region into the same
               frame. Region I only has three fables, so it cannot show what
               a full-length board looks like — and "how many tiles fit on a
               phone" is the whole reason the tile size was chosen. */
            if (/long=1/.test(location.search) && window.WorldMap) {
              setTimeout(function () {
                var nodes = [], i;
                for (i = 0; i < 12; i++) {
                  nodes.push({
                    id: 'c' + i, kind: 'fable', x: (i % 2 ? 0.70 : 0.30),
                    y: 0.92 - i * 0.08, label: '' + (i + 1),
                    titulus: 'Capitulum ' + (i + 1),
                    state: i < 4 ? 'done' : (i === 4 ? 'open' : 'shut')
                  });
                }
                nodes.push({ id: 'b', kind: 'boss', x: 0.5, y: 0.02, label: '👑',
                             titulus: 'Lupus', state: 'shut' });
                var model = { nodes: nodes, foxNode: 'c4', track: 'fabulae',
                              titulus: 'Silva', avatar: 'fox' };
                var host = document.querySelector('.map-frame');
                host.innerHTML = WorldMap.render(model);
                WorldMap.bind(host, model, { onNode: function () {} });
              }, 300);
            }
            /* A continuous board is 6–7k CSS pixels tall, so "photograph
               the map" is three shots, not one. `top` is the summit of the
               last region, `bottom` the foot of regiō I, `mid` halfway. */
            if (window.__QA_SCROLL) {
              /* re-query: &long=1 REPLACES the frame's contents, so the
                 `view` captured above may be a detached element by now. */
              setTimeout(function () {
                var v = document.querySelector('.map-view');
                if (!v) { return; }
                var max = v.scrollHeight - v.clientHeight;
                var where = window.__QA_SCROLL;
                v.scrollTop = (where === 'bottom') ? max
                  : (where === 'mid' || where === 'middle') ? Math.round(max / 2)
                  : 0;                              /* '1' / 'top' = the summit */
              }, 1200);
            }
            if (window.__QA_INDEX) {
              when('#to-regiones', function (btn) { setTimeout(function () { tap(btn); }, 900); });
            }
            return;
          }
          /* the capitulum the mascot stands on */
          when('.map-node[data-id="' + FIRST_CAP + '"]', function (node) {
            tap(node);
            if (target === 'cap') { return; }
            var label = STEP_LABEL[target];
            if (!label) { return; }
            when('.steps button.node', function () {
              var b = stepButton(label);
              if (b) { tap(b); }
              /* &play=N on the memory board: tap N still-hidden cards, one
                 every 400ms, so the shot catches a board in play. */
              if (window.__QA_PLAY && target === 'aenigmata') {
                var moves = window.__QA_PLAY;
                (function tapCard() {
                  if (moves <= 0) { return; }
                  var next = document.querySelector('.mem-card:not(.flip):not(.hit)');
                  if (next) { tap(next); moves--; }
                  window.setTimeout(tapCard, 400);
                }());
              }
              /* &page=N taps 'perge' N times so a headless shot can reach a
                 named story page instead of only the first one. */
              if (!window.__QA_PAGE) { return; }
              var left = window.__QA_PAGE;
              (function stepPage() {
                if (left <= 0) { return; }
                when('#next', function (nx) {
                  tap(nx); left--; window.setTimeout(stepPage, 200);
                }, 40);
              }());
            });
          });
        });
      });
    });
  </script>
</head>
<body>
  <header id="topbar"></header>
  <main id="app" class="screen">
    <noscript><p>Ad lūdendum, JavaScript necessārium est.</p></noscript>
  </main>
  <!-- QA-only stamp: every screenshot says what width it was LAID OUT at,
       which is not always the width the screenshot was cropped to. Finding
       that out the hard way once is enough. -->
  <div id="qa-stamp" style="position:fixed;right:0;bottom:0;z-index:99;
       font:10px/1.4 monospace;background:rgba(0,0,0,.65);color:#0f0;padding:1px 4px;"></div>
  <script>
    (function stamp() {
      var el = document.getElementById('qa-stamp');
      function paint() {
        el.textContent = window.innerWidth + '×' + window.innerHeight +
          ' scrollW=' + document.documentElement.scrollWidth +
          ' ' + (window.__QA_SCREEN || '');
      }
      paint();
      window.addEventListener('resize', paint);
      setInterval(paint, 500);
    })();
  </script>
</body>
</html>
