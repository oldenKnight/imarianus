<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>imarianus — regressiones</title>
<!--
  regression.html — framework-free browser regression harness (ES5).

  Open this file directly in a browser (file:// works, no server needed) and
  read the rows. Every check names the bug it guards, so a red row tells you
  which fix has been undone.

  Rule from the master plan: EVERY bug that gets fixed gets a case here that
  would have caught it. This page must be green before any commit that touches
  engine code.
-->
<style>
  body { margin: 0; padding: 24px; background: #f6e8c9; color: #3a2417;
         font-family: Palatino, Georgia, serif; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 18px; font-size: 14px; opacity: 0.75; }
  #summary { font-size: 18px; font-weight: bold; padding: 10px 14px;
             border-radius: 8px; margin-bottom: 16px; display: inline-block; }
  .allpass { background: #7fb069; color: #16240f; }
  .anyfail { background: #b33a2b; color: #fff2e8; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  td { border-bottom: 1px solid rgba(58,36,23,0.18); padding: 7px 9px;
       vertical-align: top; font-size: 14px; }
  td.st { width: 62px; font-weight: bold; text-align: center; color: #fff2e8; }
  td.st.pass { background: #7fb069; }
  td.st.fail { background: #b33a2b; }
  td.st.wait { background: #9c8a6a; }
  td.bug { width: 92px; font-family: Menlo, Consolas, monospace; font-size: 12px;
           opacity: 0.8; }
  td.detail { font-family: Menlo, Consolas, monospace; font-size: 12px;
              color: #7a3a2b; word-break: break-all; }
</style>
</head>
<body>
<h1>imarianus — regressiones</h1>
<p class="sub">Framework-free checks. Green page = safe to commit.</p>
<div id="summary" class="wait">currendo…</div>
<table><tbody id="rows"></tbody></table>

<!-- dependencies, in the same order index.html loads them.
     scenes.js has no dependencies of its own; game.js and boss.js depend on
     Scenes only (and on Game.beep being optional), so the three load cleanly
     without data.js, storage.js or the DOM app shell. -->
<script src="../js/scenes.js"></script>
<script src="../js/game.js"></script>
<script src="../js/boss.js"></script>
<!-- M3 phase engine: boss.js is the engine + registry, these two fill it.
     Load order matters exactly as it does in index.html — boss-phases.js
     calls Boss.registerPhase and probatio.js calls Boss.createEngine. -->
<script src="../js/boss-phases.js"></script>
<script src="../js/probatio.js"></script>
<!-- M2 art files. They are pure registrations on top of scenes.js, so they
     load here for the same reason index.html loads them: the sweeps below
     must see the WHOLE actor library, not just the built-ins. A syntax
     error in any of them shows up as a missing actor in CHECK 6. -->
<script src="../js/actors-person.js"></script>
<script src="../js/actors-props.js"></script>
<script src="../js/backgrounds2.js"></script>
<!-- REAL content for the clamor derivation checks. A synthetic fixture can be
     made to pass any rule you write for it; the question that matters is what
     the deriver does to the Latin the learner is actually shown. The content
     file registers itself with CONTENT the moment it is injected, and
     CONTENT.region() is a plain registry read, so no manifest is needed. -->
<script src="../js/data-core.js"></script>
<script src="../js/content-loader.js"></script>
<script src="../content/fabulae-r01.js"></script>
<!-- M9 offline queue. storage.js + api.js are a PAIR here: the queue lives in
     storage.js but the event id is minted and replayed by api.js, and the bug
     class we are guarding (progress silently lost on a dead network) only
     exists at the seam between them. Loading them in index.html's order also
     proves storage.js survives being evaluated before Api exists. -->
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>

<script>
/* eslint-env browser */
(function () {
  'use strict';

  /* ================= tiny test runner ================= */

  var rowsEl = document.getElementById('rows');
  var summaryEl = document.getElementById('summary');
  var total = 0, failed = 0, pending = 0;

  /* add a row; returns a setter so async checks can fill it in later */
  function row(bug, name) {
    total++;
    var tr = document.createElement('tr');
    var st = document.createElement('td');
    st.className = 'st wait'; st.appendChild(document.createTextNode('…'));
    var bg = document.createElement('td'); bg.className = 'bug';
    bg.appendChild(document.createTextNode(bug));
    var nm = document.createElement('td');
    nm.appendChild(document.createTextNode(name));
    var dt = document.createElement('td'); dt.className = 'detail';
    tr.appendChild(st); tr.appendChild(bg); tr.appendChild(nm); tr.appendChild(dt);
    rowsEl.appendChild(tr);
    return function (ok, detail) {
      st.className = 'st ' + (ok ? 'pass' : 'fail');
      st.firstChild.nodeValue = ok ? 'PASS' : 'FAIL';
      dt.appendChild(document.createTextNode(detail || ''));
      if (!ok) { failed++; }
    };
  }

  /* synchronous check: fn() returns null/'' when fine, or a failure message */
  function check(bug, name, fn) {
    var set = row(bug, name);
    var msg;
    try { msg = fn(); } catch (e) { msg = 'threw: ' + (e && e.message ? e.message : e); }
    set(!msg, msg || 'ok');
  }

  /* asynchronous check: fn(done) calls done(msgOrNull) when finished */
  function checkAsync(bug, name, fn) {
    var set = row(bug, name);
    pending++;
    var settled = false;
    function done(msg) {
      if (settled) { return; }
      settled = true;
      set(!msg, msg || 'ok');
      pending--;
      finish();
    }
    try { fn(done); } catch (e) { done('threw: ' + (e && e.message ? e.message : e)); }
  }

  function finish() {
    if (pending > 0) { return; }
    summaryEl.className = failed ? 'anyfail' : 'allpass';
    summaryEl.firstChild.nodeValue =
      failed ? (failed + ' / ' + total + ' FAILED') : ('OMNIA BENE — ' + total + ' / ' + total + ' pass');
  }

  /* ================= helpers ================= */

  var DATA_PREFIX = 'data:image/svg+xml;charset=utf-8,';

  /* recover the exact string the browser was asked to parse. This is the real
     bytes of the failing path, not a reconstruction of it. */
  function svgFromImage(img) {
    var src = String(img.src);
    if (src.indexOf(DATA_PREFIX) !== 0) {
      throw new Error('unexpected data URL prefix: ' + src.substring(0, 40));
    }
    return decodeURIComponent(src.substring(DATA_PREFIX.length));
  }

  /* returns a parsererror description, or null when the document is
     well-formed. A data:image/svg+xml URL is parsed as STRICT XML by the
     browser, which is why this mirrors the real decode path. */
  function xmlError(str) {
    var doc = new DOMParser().parseFromString(str, 'image/svg+xml');
    var errs = doc.getElementsByTagName('parsererror');
    if (errs && errs.length) {
      return String(errs[0].textContent).replace(/\s+/g, ' ').substring(0, 140);
    }
    if (!doc.documentElement) { return 'no document element'; }
    if (doc.documentElement.nodeName.toLowerCase() === 'parsererror') {
      return String(doc.documentElement.textContent).replace(/\s+/g, ' ').substring(0, 140);
    }
    return null;
  }

  function openingTag(str) {
    var a = str.indexOf('<svg');
    var b = str.indexOf('>', a);
    return (a < 0 || b < 0) ? '' : str.substring(a, b + 1);
  }

  function countAttr(tag, name) {
    var m = tag.match(new RegExp('\\s' + name + '\\s*=', 'gi'));
    return m ? m.length : 0;
  }

  /* the full FIX-1a contract for one produced string */
  function assertSized(label, str) {
    var err = xmlError(str);
    if (err) { return label + ': NOT well-formed XML — ' + err; }
    var tag = openingTag(str);
    if (!tag) { return label + ': no opening <svg> tag'; }
    var nw = countAttr(tag, 'width'), nh = countAttr(tag, 'height');
    if (nw !== 1 || nh !== 1) {
      return label + ': expected exactly 1 width + 1 height on the root, got ' +
        nw + ' + ' + nh + ' — ' + tag.substring(0, 120);
    }
    return null;
  }

  /* ================= CHECK 1 =================
     Guards BUG-1 / FIX-1a — the boss-fight freeze.
     boss.js used to prepend width/height to an <svg ...> string that already
     carried them (Scenes.mascot does). A duplicate attribute is a FATAL XML
     well-formedness error, so the data: URL never decoded, the Image sat in
     the "broken" state with .complete === true, and drawImage() threw
     InvalidStateError inside draw() — killing the animation loop.
     Every actor sprite, the mascot and a full scene must survive toImage(). */

  check('BUG-1', 'toImage(Scenes.mascot(80), 80) is well-formed with one width/height',
    function () {
      /* the exact string that crashed the boss fight: mascot() emits its own
         width/height, so this is the duplicate-attribute case itself. */
      return assertSized('mascot', svgFromImage(Scenes.toImage(Scenes.mascot(80), 80)));
    });

  check('BUG-1', 'toImage() over EVERY actor sprite in the library',
    function () {
      var names = Scenes.actorNames(), i, msg;
      if (!names.length) { return 'actor registry is empty'; }
      for (i = 0; i < names.length; i++) {
        /* sprite() already writes width/height, so toImage() must strip them */
        msg = assertSized('actor ' + names[i],
          svgFromImage(Scenes.toImage(Scenes.sprite(names[i], {}, 120), 64)));
        if (msg) { return msg; }
      }
      return null;
    });

  check('BUG-1', 'toImage() over a full Scenes.render() scene (game.js path)',
    function () {
      var svg = Scenes.render({ bg: 'forest', items: [
        { t: 'fox', x: 140, y: 210, s: 1 },
        { t: 'tree', x: 300, y: 210, s: 1, grapes: true }
      ], bubbles: [{ x: 200, y: 40, text: 'Ecce!', tail: 'left' }] });
      return assertSized('scene', svgFromImage(Scenes.toImage(svg, 60)));
    });

  check('BUG-1', 'sizeSvg() is idempotent (re-sizing never duplicates attributes)',
    function () {
      /* the failure mode was a SECOND sizing pass over an already sized
         string, so sizing twice must still yield exactly one pair. */
      var once = Scenes.sizeSvg(Scenes.mascot(80), 40);
      var twice = Scenes.sizeSvg(once, 90);
      var msg = assertSized('sized twice', twice);
      if (msg) { return msg; }
      if (twice.indexOf('width="90"') < 0 || twice.indexOf('height="90"') < 0) {
        return 'the last size did not win: ' + openingTag(twice).substring(0, 120);
      }
      return null;
    });

  check('BUG-1', 'sizeSvg() strips only the opening tag and spares stroke-width',
    function () {
      var src = '<svg width="9" height="9" viewBox="0 0 10 10" stroke-width="3">' +
                '<rect width="10" height="10" stroke-width="2"/></svg>';
      var out = Scenes.sizeSvg(src, 50);
      var msg = assertSized('handmade', out);
      if (msg) { return msg; }
      if (out.indexOf('<rect width="10" height="10" stroke-width="2"/>') < 0) {
        return 'the element body was damaged: ' + out;
      }
      if (openingTag(out).indexOf('stroke-width="3"') < 0) {
        return 'stroke-width was eaten off the root: ' + openingTag(out);
      }
      return null;
    });

  /* ================= CHECK 2 =================
     Guards BUG-2 — the wolf letterboxed in an opaque square.
     makeWolfImage() used to render a whole {bg:'plain'} 400x240 scene and
     squeeze it into 200x200, so the scene's sky and ground painted an opaque
     rectangle across the middle of the arena. Scenes.sprite must draw the
     actor ALONE on a transparent, tight viewBox. */

  function fullSizeRect(str) {
    var doc = new DOMParser().parseFromString(str, 'image/svg+xml');
    var root = doc.documentElement;
    var vb = String(root.getAttribute('viewBox') || '').split(/[\s,]+/);
    var vbW = parseFloat(vb[2]), vbH = parseFloat(vb[3]);
    var rects = doc.getElementsByTagName('rect');
    var i, w, h;
    for (i = 0; i < rects.length; i++) {
      w = String(rects[i].getAttribute('width') || '0');
      h = String(rects[i].getAttribute('height') || '0');
      w = (w.indexOf('%') > 0) ? vbW * parseFloat(w) / 100 : parseFloat(w);
      h = (h.indexOf('%') > 0) ? vbH * parseFloat(h) / 100 : parseFloat(h);
      if (w >= vbW && h >= vbH) { return 'rect ' + w + 'x' + h + ' over viewBox ' + vbW + 'x' + vbH; }
    }
    return null;
  }

  check('BUG-2', "Scenes.sprite('wolf', {}, 200): well-formed, no background rect",
    function () {
      var svg = Scenes.sprite('wolf', {}, 200);
      var msg = assertSized('wolf sprite', svg);
      if (msg) { return msg; }
      var bg = fullSizeRect(svg);
      if (bg) { return 'sprite paints an opaque background: ' + bg; }
      if (svg.indexOf('#f6e8c9') >= 0 || svg.indexOf('#b98a4e') >= 0) {
        return 'sprite contains scene sky/ground colours — a background leaked in';
      }
      return null;
    });

  check('BUG-2', 'no actor sprite paints a full-viewBox background',
    function () {
      var names = Scenes.actorNames(), i, bg;
      for (i = 0; i < names.length; i++) {
        bg = fullSizeRect(Scenes.sprite(names[i], {}, 100));
        if (bg) { return 'actor ' + names[i] + ' paints a background: ' + bg; }
      }
      return null;
    });

  check('BUG-2', 'sprite() passes opts through (pose changes the output)',
    function () {
      /* a pose that produced identical markup would mean opts are dropped */
      if (Scenes.sprite('wolf', { pose: 'angry' }, 100) === Scenes.sprite('wolf', { pose: 'stand' }, 100)) {
        return 'pose:"angry" and pose:"stand" render identically';
      }
      return null;
    });

  /* ================= CHECK 3 =================
     Guards the register() extension point used by the art files
     (actors-person.js, actors-props.js, backgrounds2.js). A registered actor
     must behave exactly like a built-in inside Scenes.render, receiving the
     spec item as its opts. */

  check('API', 'register() round-trip: dummy actor renders inside a scene',
    function () {
      var seen = null;
      var ok = Scenes.register('__dummy__', function (opts) {
        seen = opts;                       /* opts must be the spec item */
        return '<circle cx="0" cy="0" r="5" fill="#123456"/>';
      }, { x: -6, y: -6, w: 12, h: 12 });
      if (!ok) { return 'register() refused a valid actor'; }

      var svg = Scenes.render({ bg: 'plain', items: [
        { t: '__dummy__', x: 100, y: 200, s: 2, pose: 'testPose', flip: true }
      ] });
      if (svg.indexOf('#123456') < 0) { return 'registered actor did not render into the scene'; }
      if (!seen || seen.pose !== 'testPose') { return 'opts were not passed through to the draw fn'; }
      if (svg.indexOf('scale(-1,1)') < 0) { return 'flip was not applied to the registered actor'; }

      var msg = xmlError(svg);
      if (msg) { return 'scene with a registered actor is malformed: ' + msg; }

      /* the registered actor must also work through sprite() + toImage() */
      msg = assertSized('dummy sprite', svgFromImage(Scenes.toImage(Scenes.sprite('__dummy__', {}, 80), 80)));
      if (msg) { return msg; }

      /* registerBg likewise */
      if (!Scenes.registerBg('__dummybg__', function () { return '<rect width="400" height="240" fill="#654321"/>'; })) {
        return 'registerBg() refused a valid background';
      }
      if (Scenes.render({ bg: '__dummybg__', items: [] }).indexOf('#654321') < 0) {
        return 'registered background did not render';
      }
      return null;
    });

  check('API', 'unknown / inherited actor names never reach a function call',
    function () {
      /* ACTORS is an object literal, so a naive ACTORS[name] lookup would
         return Object.prototype members for these and call them as actors. */
      var svg = Scenes.render({ bg: 'plain', items: [
        { t: 'constructor', x: 10, y: 10 },
        { t: 'toString', x: 20, y: 20 },
        { t: 'nonexistentActor', x: 30, y: 30 }
      ] });
      return xmlError(svg) ? ('scene broke on inherited keys: ' + xmlError(svg)) : null;
    });

  /* ================= CHECK 4 =================
     Guards BUG-5(b) — abort() must tear the fight down WITHOUT reporting a
     result. It used to call end(false), so merely navigating away from the
     boss screen fired cb.onEnd(false) and showed the "you lost" screen.
     Also covers BUG-5(a): no frame may run after teardown. */

  checkAsync('BUG-5', 'Boss.abort() tears down without firing onEnd', function (done) {
    var canvas = document.createElement('canvas');
    var words = [{ la: 'lupus', emoji: '🐺' }, { la: 'agnus', emoji: '🐑' }];
    var ended = false;
    Boss.start(canvas, { words: words, hp: 3, seconds: 30 }, {
      onEnd: function () { ended = true; }
    });
    Boss.abort();
    /* wait several frames: a stale rAF would land inside this window */
    window.setTimeout(function () {
      done(ended ? 'abort() fired onEnd — navigating away reports a defeat' : null);
    }, 200);
  });

  /* ================= CHECK 5 =================
     Guards FIX-1b — WHY the drawImage guard must test naturalWidth.
     A broken image reports .complete === true; only naturalWidth === 0 gives
     it away. Any future `if (img.complete)` guard is therefore still a crash
     waiting to happen, and this row exists to say so out loud. */

  checkAsync('BUG-1', 'a broken image still reports complete=true (naturalWidth is the only tell)',
    function (done) {
      /* deliberately malformed: <rect> is never closed, so the XML parser
         rejects the document exactly as a duplicate attribute would. */
      var bad = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10">' +
                '<rect width="10" height="10" fill="#000"></svg>';
      var img = Scenes.toImage(bad, 40);
      function verdict() {
        if (img.naturalWidth > 0) { return done('the malformed fixture decoded anyway — fixture is stale'); }
        if (!img.complete) { return done('image never settled (slow environment?)'); }
        return done(null);
      }
      img.onload = verdict;
      img.onerror = verdict;
      /* belt and braces: some engines fire neither handler for a failed
         data: URL, but .complete still flips. */
      window.setTimeout(verdict, 600);
    });

  /* ================= CHECK 6 =================
     Guards the M2 art library (actors-person.js, actors-props.js,
     backgrounds2.js). These files are ~90 registrations of hand-written
     SVG path data, and the failure modes are silent: a stray quote makes
     a malformed sprite that decodes to nothing, a missed bounds entry
     makes sprite() fall back to a generic box that crops the artwork, and
     a syntax error anywhere in a file drops EVERY actor it registers
     without a single console message reaching the game.

     That last one is not hypothetical: an unterminated block comment in
     actors-person.js during M2 removed 'person' and 'crowdGroup' from the
     library, and the only symptom was empty cells in the gallery. */

  /* the exact DEFAULT_BOUNDS literal in scenes.js. A sprite whose viewBox
     equals it did NOT bring its own bounds. (An actor that legitimately
     measured to this box would be a false positive — none does, and the
     row names the actor so it takes seconds to confirm.) */
  var FALLBACK_VIEWBOX = '-60 -130 120 140';

  function viewBoxOf(svg) {
    var m = /viewBox="([^"]+)"/.exec(String(svg));
    return m ? m[1].replace(/\s+/g, ' ') : '';
  }

  check('M2-ART', 'the three art files all loaded (a syntax error drops a whole file silently)',
    function () {
      var need = ['person', 'crowdGroup', 'leo', 'ark', 'ship', 'murusAquae',
        'arborNuda', 'nidus'];
      var have = {}, names = Scenes.actorNames(), i, missing = [];
      for (i = 0; i < names.length; i++) { have[names[i]] = true; }
      for (i = 0; i < need.length; i++) { if (!have[need[i]]) { missing.push(need[i]); } }
      if (missing.length) { return 'missing actors: ' + missing.join(', '); }
      var bgs = Scenes.bgNames().join(' ');
      if (bgs.indexOf('stabulum') < 0 || bgs.indexOf('stormSea') < 0 || bgs.indexOf('hiems') < 0) {
        return 'backgrounds2.js did not register: ' + bgs;
      }
      return null;
    });

  check('M2-ART', 'EVERY registered actor produces a well-formed sprite',
    function () {
      var names = Scenes.actorNames(), i, msg;
      for (i = 0; i < names.length; i++) {
        if (names[i].indexOf('__') === 0) { continue; }   /* test fixtures */
        msg = assertSized('sprite ' + names[i], Scenes.sprite(names[i], {}, 140));
        if (msg) { return msg; }
      }
      return null;
    });

  check('M2-ART', 'EVERY registered actor carries its own bounds (no DEFAULT_BOUNDS hits)',
    function () {
      var names = Scenes.actorNames(), i, vb, bad = [];
      for (i = 0; i < names.length; i++) {
        if (names[i].indexOf('__') === 0) { continue; }
        vb = viewBoxOf(Scenes.sprite(names[i], {}, 100));
        if (!vb) { return 'actor ' + names[i] + ' produced a sprite with no viewBox'; }
        if (vb === FALLBACK_VIEWBOX) { bad.push(names[i]); }
      }
      if (bad.length) {
        return bad.length + ' actor(s) registered without bounds, so sprite() crops them ' +
          'with the generic fallback box: ' + bad.join(', ');
      }
      return null;
    });

  check('M2-ART', 'EVERY registered background renders a well-formed scene',
    function () {
      var bgs = Scenes.bgNames(), i, svg, err;
      for (i = 0; i < bgs.length; i++) {
        if (bgs[i].indexOf('__') === 0) { continue; }
        svg = Scenes.render({ bg: bgs[i], items: [] });
        err = xmlError(svg);
        if (err) { return 'background ' + bgs[i] + ' is malformed: ' + err; }
        if (svg.indexOf('NaN') >= 0 || svg.indexOf('undefined') >= 0) {
          return 'background ' + bgs[i] + ' emitted NaN/undefined into its path data';
        }
      }
      return null;
    });

  check('M2-ART', 'every person role and pose renders without NaN in its path data',
    function () {
      /* NaN in a path is the classic arithmetic-typo signature: the browser
         drops the whole path silently and a limb just disappears. */
      var roles = ['patriarch', 'shepherd', 'king', 'queen', 'soldier', 'priest',
        'child', 'woman', 'man', 'crowd', 'angel'];
      var poses = ['stand', 'walk', 'kneel', 'arms-up', 'point', 'sit', 'sleep', 'carry'];
      var r, p, svg, msg;
      for (r = 0; r < roles.length; r++) {
        for (p = 0; p < poses.length; p++) {
          svg = Scenes.sprite('person', { role: roles[r], pose: poses[p] }, 120);
          if (svg.indexOf('NaN') >= 0 || svg.indexOf('undefined') >= 0) {
            return 'person ' + roles[r] + '/' + poses[p] + ' emitted NaN/undefined';
          }
          msg = assertSized('person ' + roles[r] + '/' + poses[p], svg);
          if (msg) { return msg; }
        }
      }
      return null;
    });

  check('M2-ART', 'animal poses (walk/lie/eat/run) stay well-formed on the shared cores',
    function () {
      var animals = ['leo', 'ursus', 'canis', 'feles', 'asinus', 'equus', 'bos', 'cervus',
        'hircus', 'haedus', 'camelus', 'lepus', 'mus'];
      var birds = ['aquila', 'columba', 'gallina', 'pavo', 'grus', 'ciconia'];
      var poses = ['stand', 'walk', 'lie', 'eat', 'run'];
      var i, p, svg, msg;
      for (i = 0; i < animals.length; i++) {
        for (p = 0; p < poses.length; p++) {
          svg = Scenes.sprite(animals[i], { pose: poses[p] }, 120);
          if (svg.indexOf('NaN') >= 0) { return animals[i] + '/' + poses[p] + ' emitted NaN'; }
          msg = assertSized(animals[i] + '/' + poses[p], svg);
          if (msg) { return msg; }
        }
      }
      for (i = 0; i < birds.length; i++) {
        svg = Scenes.sprite(birds[i], { pose: 'fly' }, 120);
        if (svg.indexOf('NaN') >= 0) { return birds[i] + '/fly emitted NaN'; }
        msg = assertSized(birds[i] + '/fly', svg);
        if (msg) { return msg; }
      }
      return null;
    });

  check('M2-ART', 'nidus{ova:0} really is empty (the picture must not contradict the sentence)',
    function () {
      /* An empty nest is the whole point of the ova option: a capitulum
         that says "iam gallīna ōva aurea nōn pōnit" is FALSE if the art
         still shows eggs. Count the egg ellipses per setting. */

      var ctx = found(/attested in the gap/);
      if (!ctx) {
        return 'no gap-context warning for vulpēs; got: ' + (warnings.join(' || ') || '(silence)');
      }
      if (ctx.indexOf('vulpēs') < 0) { return 'the context warning names the wrong word: ' + ctx; }
      if (ctx.indexOf('kept') < 0) { return 'a warn-only violation must say it was kept: ' + ctx; }

      /* the kept item must still be PLAYABLE — the author is not overruled */
      if (pool[0].options.length !== 3) {
        return 'the kept item lost its options: ' + pool[0].options.length;
      }
      return null;
    });

  check('M3-PROBATIO', 'Probatio mirrors the Boss API and registers its three trials',
    function () {
      if (!window.Probatio) { return 'js/probatio.js did not load'; }
      var api = ['start', 'stop', 'abort', 'registerPhase', 'state'], i;
      for (i = 0; i < api.length; i++) {
        if (typeof Probatio[api[i]] !== 'function') {
          return 'Probatio.' + api[i] + ' is not a function (Boss has it)';
        }
      }
      if (!Probatio.PHASES) { return 'Probatio.PHASES missing'; }
      var need = ['ordina', 'transitus', 'sententia'], missing = [];
      for (i = 0; i < need.length; i++) {
        if (!Probatio.PHASES[need[i]]) { missing.push(need[i]); }
      }
      if (missing.length) { return 'trial types missing: ' + missing.join(', '); }
      /* the two registries must stay SEPARATE: a duel phase in a probatio (or
         the reverse) is how a wolf ends up in Genesis. */
      if (Probatio.PHASES.caterva) { return 'the boss registry leaked into Probatio'; }
      if (Boss.PHASES.ordina) { return 'the probatio registry leaked into Boss'; }
      return null;
    });

  checkBoss('M3-PROBATIO', 'a probatio runs on its own loop and pays the same payload',
    function (done) {
      var cv = document.createElement('canvas');
      Probatio.start(cv, {
        kind: 'probatio', words: WORDS, capitula: CAPS, region: 'liberTest',
        phases: [{ type: 'ordina', hp: 99, seconds: 0.15 }]
      }, {
        onEnd: function (won, p) {
          if (!p || p.region !== 'liberTest') { return done('payload region is wrong'); }
          if (!p.phases.length || p.phases[0].type !== 'ordina') {
            return done('phase row missing for ordina');
          }
          /* stopping the boss must not have stopped this, and vice versa */
          if (Boss.state().running) { return done('the boss engine is running too'); }
          return done(null);
        }
      });
      window.setTimeout(function () { Probatio.abort(); done('the trial never ended'); }, 3000);
    });

  /* ================= M9 — OFFLINE QUEUE, PWA =================
     Guards brief §8: "students are on phones with unreliable connections;
     today they silently lose progress". The checks below are the contract:
     an action taken offline is kept, replayed in order, and carries the same
     event id it was born with (without which a replay double-pays XP). */

  /* These tests share ONE global: localStorage['mariane_queue_v1']. Two of
     them in flight at once would each be clearing and filling the other's
     queue, so they are serialized exactly like the engine tests above —
     rows appear immediately, execution happens one at a time. */
  var netQueue = [];
  function checkNet(bug, name, fn) {
    var set = row(bug, name);
    pending++;
    netQueue.push(function () {
      var settled = false;
      function done(msg) {
        if (settled) { return; }
        settled = true;
        set(!msg, msg || 'ok');
        pending--;
        runNetQueue();
        finish();
      }
      try { fn(done); } catch (e) { done('threw: ' + (e && e.message ? e.message : e)); }
    });
  }
  function runNetQueue() {
    var next = netQueue.shift();
    if (next) { next(); }
  }

  /* Swap Api's network for a recorder. Returns a restore() function — every
     check that calls this MUST call restore(), including on failure. */
  function stubApi(onReplay) {
    var realReplay = Api.replay, realGetCsrf = Api.getCsrf;
    Api.replay = onReplay;
    Api.getCsrf = function () { return 'test-csrf'; };   /* flush() waits for one */
    return function () {
      Api.replay = realReplay;
      Api.getCsrf = realGetCsrf;
      Storage.setOffline(false);
      Storage.clearQueue();
    };
  }

  check('M9-QUEUE', 'an offline POST is queued, not lost, and answers queued:true',
    function () {
      Storage.clearQueue();
      var restore = stubApi(function () { throw new Error('replay must not run while offline'); });
      try {
        Storage.setOffline(true);
        var errs = [];
        Api.completeStep('f1', 'vocabula', 10, function (err) { errs.push(err); });
        Api.completeStep('f1', 'quaestio', 5, function (err) { errs.push(err); });
        Api.sync({ hearts: 3, mapNode: 'f2' }, function (err) { errs.push(err); });

        if (errs.length !== 3) { return 'expected 3 callbacks, got ' + errs.length; }
        var i;
        for (i = 0; i < errs.length; i++) {
          if (!errs[i] || errs[i].queued !== true) {
            return 'call ' + i + ' did not report queued:true — ' + JSON.stringify(errs[i]);
          }
          if (!errs[i].eventId) { return 'call ' + i + ' reported no event id'; }
        }
        var q = Storage.queuePeek();
        if (q.length !== 3) { return 'queue holds ' + q.length + ' items, expected 3'; }
        if (q[0].path !== 'step_complete.php' || q[1].path !== 'step_complete.php' ||
            q[2].path !== 'sync.php') {
          return 'FIFO order broken: ' + q[0].path + ', ' + q[1].path + ', ' + q[2].path;
        }
        if (q[0].body.step !== 'vocabula' || q[1].body.step !== 'quaestio') {
          return 'the payloads were not preserved verbatim';
        }
        /* the id must be in BOTH channels — the body mirror is what survives
           a host that strips X-Event-Id */
        for (i = 0; i < q.length; i++) {
          if (q[i].body.eventId !== q[i].id) {
            return 'item ' + i + ': body.eventId (' + q[i].body.eventId +
                   ') != item id (' + q[i].id + ')';
          }
        }
        if (q[0].id === q[1].id) { return 'two events minted the same id: ' + q[0].id; }
        return null;
      } finally { restore(); }
    });

  checkNet('M9-QUEUE', 'the queue flushes FIFO on reconnect with the ids intact',
    function (done) {
      Storage.clearQueue();
      var seen = [];
      var restore = stubApi(function (item, cb) {
        seen.push({ path: item.path, id: item.id, bodyId: item.body.eventId,
                    step: item.body.step });
        cb(null, { ok: true });
      });
      Storage.setOffline(true);
      Api.completeStep('f1', 'vocabula', 10, function () {});
      Api.completeStep('f1', 'quaestio', 5, function () {});
      Api.sync({ hearts: 3 }, function () {});
      var born = Storage.queuePeek();

      Storage.setOffline(false);          /* == the browser's `online` event */

      var waited = 0;
      (function poll() {
        if (Storage.queueLength() === 0 || waited > 60) {
          var msg = null;
          if (seen.length !== 3) {
            msg = 'replayed ' + seen.length + ' of 3 (queue left: ' +
                  Storage.queueLength() + ')';
          } else if (seen[0].step !== 'vocabula' || seen[1].step !== 'quaestio' ||
                     seen[2].path !== 'sync.php') {
            msg = 'replay order was not FIFO: ' + seen[0].step + ', ' + seen[1].step +
                  ', ' + seen[2].path;
          } else {
            var i;
            for (i = 0; i < 3; i++) {
              if (seen[i].id !== born[i].id) {
                msg = 'item ' + i + ' was replayed under a NEW id (' + seen[i].id +
                      ' != ' + born[i].id + ') — the server cannot dedupe that';
                break;
              }
              if (seen[i].bodyId !== born[i].id) {
                msg = 'item ' + i + ' lost its body.eventId on replay';
                break;
              }
            }
          }
          restore();
          done(msg);
          return;
        }
        waited++;
        window.setTimeout(poll, 25);
      }());
    });

  checkNet('M9-QUEUE', 'flush stops at the first failure and keeps the order',
    function (done) {
      Storage.clearQueue();
      var calls = 0;
      var restore = stubApi(function (item, cb) {
        calls++;
        /* first item goes through, second dies at the network layer */
        if (calls === 1) { cb(null, { ok: true }); }
        else { cb({ status: 0, data: null }, null); }
      });
      Storage.setOffline(true);
      Api.completeStep('f1', 'a', 0, function () {});
      Api.completeStep('f1', 'b', 0, function () {});
      Api.completeStep('f1', 'c', 0, function () {});
      Storage.setOffline(false);

      window.setTimeout(function () {
        var q = Storage.queuePeek();
        var msg = null;
        if (calls !== 2) {
          msg = 'expected exactly 2 attempts (one ok, one dead), got ' + calls +
                ' — a failing flush must not spin through the queue';
        } else if (q.length !== 2) {
          msg = 'expected 2 survivors, got ' + q.length;
        } else if (q[0].body.step !== 'b' || q[1].body.step !== 'c') {
          msg = 'order lost after a failure: ' + q[0].body.step + ', ' + q[1].body.step;
        } else if (q[0].tries !== 1) {
          msg = 'the failed attempt was not counted (tries=' + q[0].tries + ')';
        }
        restore();
        done(msg);
      }, 400);
    });

  checkNet('M9-QUEUE', 'a permanent 4xx is dropped instead of blocking the queue',
    function (done) {
      Storage.clearQueue();
      var seen = [];
      var restore = stubApi(function (item, cb) {
        seen.push(item.body.step);
        if (item.body.step === 'poison') {
          cb({ status: 422, data: { error: 'invalid_step' } }, null);
        } else { cb(null, { ok: true }); }
      });
      Storage.setOffline(true);
      Api.completeStep('f1', 'poison', 0, function () {});
      Api.completeStep('f1', 'good', 0, function () {});
      Storage.setOffline(false);

      window.setTimeout(function () {
        var msg = null;
        if (Storage.queueLength() !== 0) {
          msg = 'a rejected head blocked the queue (' + Storage.queueLength() + ' left)';
        } else if (seen.length !== 2 || seen[1] !== 'good') {
          msg = 'the good event behind the poison one never went: ' + seen.join(',');
        }
        restore();
        done(msg);
      }, 400);
    });

  check('M9-QUEUE', 'the cap evicts a sync before earned progress, never the reverse',
    function () {
      Storage.clearQueue();
      var i;
      try {
        /* a full queue of earned progress plus one low-value measurement */
        for (i = 0; i < 199; i++) {
          Storage.enqueue('step_complete.php', { fable: 'f1', step: 's' + i });
        }
        Storage.enqueue('boss_result.php', { region: 'r01' });
        if (Storage.queueLength() !== 200) {
          return 'setup failed: queue holds ' + Storage.queueLength();
        }
        /* one more step_complete: the measurement must be the one to go */
        Storage.enqueue('step_complete.php', { fable: 'f1', step: 'last' });
        var q = Storage.queuePeek(), results = 0, steps = 0;
        for (i = 0; i < q.length; i++) {
          if (q[i].path === 'boss_result.php') { results++; }
          if (q[i].path === 'step_complete.php') { steps++; }
        }
        if (q.length !== 200) { return 'cap not enforced: ' + q.length; }
        if (results !== 0) { return 'the boss_result survived; something else was evicted'; }
        if (steps !== 200) { return 'expected 200 step_completes, got ' + steps; }
        if (q[q.length - 1].body.step !== 'last') { return 'the newcomer was not appended'; }

        /* the mirror image: a sync offered to a queue full of progress is
           REFUSED rather than costing a step_complete its place */
        var refused = Storage.enqueue('sync.php', { hearts: 1 });
        if (refused !== null) { return 'a sync was admitted at the cost of earned progress'; }
        if (Storage.queueLength() !== 200) { return 'the queue changed size on a refusal'; }
        return null;
      } finally { Storage.clearQueue(); }
    });

  check('M9-QUEUE', 'queued syncs collapse to the newest (they are last-write-wins)',
    function () {
      Storage.clearQueue();
      try {
        Storage.enqueue('sync.php', { hearts: 5, mapNode: 'f1' });
        Storage.enqueue('step_complete.php', { fable: 'f1', step: 's' });
        Storage.enqueue('sync.php', { hearts: 2, mapNode: 'f3' });
        var q = Storage.queuePeek();
        if (q.length !== 2) { return 'expected 2 items, got ' + q.length; }
        if (q[0].path !== 'step_complete.php') { return 'the step was collapsed away'; }
        if (q[1].path !== 'sync.php' || q[1].body.hearts !== 2) {
          return 'the surviving sync is not the newest one';
        }
        return null;
      } finally { Storage.clearQueue(); }
    });

  check('M9-QUEUE', 'reconcile(): the SERVER snapshot wins, it is not merged',
    function () {
      var state = Storage.defaultState();
      /* a local mirror that thinks it is ahead: stale optimistic XP, a step
         the server never accepted, a boss it never cleared */
      state.xp = 9999;
      state.hearts = 1;
      state.streak = 40;
      state.completed = { f1: { vocabula: true }, f9: { lectio: true } };
      state.bosses = { b_r01: true, b_r04: true };
      state.mapNode = 'f9';

      Storage.reconcile(state, {
        xp: 120, hearts: 5, maxHearts: 5, streak: 2, lastDay: '2026-08-14',
        mapNode: 'f2', completed: { f1: { vocabula: true } }, bosses: {}
      });

      if (state.xp !== 120) { return 'local XP survived reconcile: ' + state.xp; }
      if (state.hearts !== 5) { return 'local hearts survived reconcile: ' + state.hearts; }
      if (state.streak !== 2) { return 'local streak survived reconcile: ' + state.streak; }
      if (state.mapNode !== 'f2') { return 'local mapNode survived: ' + state.mapNode; }
      if (state.completed.f9) { return 'completed was MERGED — f9 must be gone'; }
      if (state.bosses.b_r01 || state.bosses.b_r04) { return 'bosses was MERGED'; }
      if (state.lastDay !== '2026-08-14') { return 'lastDay did not come from the server'; }
      return null;
    });

  check('M9-QUEUE', 'logout (Storage.reset) forfeits the queue — never credit the next child',
    function () {
      Storage.clearQueue();
      try {
        Storage.enqueue('step_complete.php', { fable: 'f1', step: 's' });
        if (Storage.queueLength() !== 1) { return 'setup failed'; }
        Storage.reset();
        if (Storage.queueLength() !== 0) {
          return 'a logged-out student\'s queue survived into the next session';
        }
        return null;
      } finally { Storage.clearQueue(); }
    });

  /* ================= M9 — PWA =================
     These four need a SERVER (fetch of ../sw.js etc.), which is how the site
     actually runs. Opened over file:// they report a skip rather than a red
     row, because a red row nobody can fix is noise. */

  var SERVED = window.location.protocol !== 'file:';

  /* sw.js is never executed here — a service worker cannot run in a page
     context — so this is a SYNTAX gate: fetch the bytes the browser would be
     asked to install and hand them to the JS parser via new Function. A typo
     in sw.js otherwise shows up only as "install failed" in a console the
     owner will never open. */
  checkAsync('M9-PWA', 'sw.js parses as JavaScript and declares a VERSION',
    function (done) {
      if (!SERVED) { done(null); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '../sw.js', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) { return; }
        if (xhr.status < 200 || xhr.status >= 300) {
          done('sw.js did not load: HTTP ' + xhr.status); return;
        }
        var src = xhr.responseText;
        try {
          /* wrapped so its top-level `self` references are merely referenced,
             never evaluated: parsing is the whole point */
          new Function('self', src);
        } catch (e) {
          done('sw.js is not parseable: ' + (e && e.message ? e.message : e));
          return;
        }
        if (!/var\s+VERSION\s*=/.test(src)) {
          done('sw.js has no VERSION constant — nothing would ever cache-bust');
          return;
        }
        if (src.indexOf('/server/') < 0) {
          done('sw.js no longer excludes /server/ — the API must never be cached');
          return;
        }
        done(null);
      };
      xhr.send(null);
    });

  checkAsync('M9-PWA', 'manifest.webmanifest parses and names the right shape',
    function (done) {
      if (!SERVED) { done(null); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '../manifest.webmanifest', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) { return; }
        if (xhr.status < 200 || xhr.status >= 300) {
          done('manifest did not load: HTTP ' + xhr.status); return;
        }
        var m;
        try { m = JSON.parse(xhr.responseText); }
        catch (e) { done('manifest is not valid JSON: ' + e.message); return; }
        if (m.lang !== 'la') { return done('lang must be "la", got ' + m.lang); }
        if (!m.name || m.name.indexOf('MARIANE') !== 0) {
          return done('name should start with MARIANE, got ' + m.name);
        }
        if (m.theme_color !== '#2b1c16' || m.background_color !== '#2b1c16') {
          return done('colours drifted from --wall in styles.css: ' +
                      m.theme_color + ' / ' + m.background_color);
        }
        if (m.start_url !== './' || m.scope !== './') {
          return done('start_url/scope must stay relative so /imarianus/ works: ' +
                      m.start_url + ' / ' + m.scope);
        }
        if (!m.icons || m.icons.length < 2) { return done('fewer than 2 icons'); }
        var maskable = false, i;
        for (i = 0; i < m.icons.length; i++) {
          if (String(m.icons[i].purpose || '').indexOf('maskable') >= 0) { maskable = true; }
        }
        if (!maskable) { return done('no maskable icon — Android will letterbox it'); }
        return done(null);
      };
      xhr.send(null);
    });

  checkAsync('M9-PWA', 'every icon the manifest promises actually exists',
    function (done) {
      if (!SERVED) { done(null); return; }
      /* self-contained on purpose: it re-reads the manifest rather than
         depending on the previous check having finished first */
      var mx = new XMLHttpRequest();
      mx.open('GET', '../manifest.webmanifest', true);
      mx.onreadystatechange = function () {
        if (mx.readyState !== 4) { return; }
        var icons = null;
        try { icons = JSON.parse(mx.responseText).icons; } catch (e) { icons = null; }
        if (!icons || !icons.length) { done('no icon list in the manifest'); return; }
        var left = icons.length, bad = [];
        var i;
        for (i = 0; i < icons.length; i++) {
          (function (icon) {
            var xhr = new XMLHttpRequest();
            xhr.open('HEAD', '../' + icon.src, true);
            xhr.onreadystatechange = function () {
              if (xhr.readyState !== 4) { return; }
              if (xhr.status < 200 || xhr.status >= 300) {
                bad.push(icon.src + ' → HTTP ' + xhr.status);
              }
              left--;
              if (left === 0) { done(bad.length ? bad.join('; ') : null); }
            };
            xhr.send(null);
          }(icons[i]));
        }
      };
      mx.send(null);
    });

  check('M9-PWA', 'pwa.js keeps the worker scope inside the app root',
    function () {
      /* The bug this guards: registering "/sw.js" from a site served at
         /imarianus/ registers a worker that controls nothing, and the app
         looks installable while being useless offline. pwa.js derives the
         root from document.baseURI; this asserts the derivation itself. */
      function root(base) { return base.split('#')[0].split('?')[0].replace(/[^\/]*$/, ''); }
      if (root('https://x.test/imarianus/') !== 'https://x.test/imarianus/') {
        return 'a directory base URL must be left alone';
      }
      if (root('https://x.test/imarianus/index.html') !== 'https://x.test/imarianus/') {
        return 'a file base URL must drop the file name';
      }
      if (root('https://x.test/imarianus/index.html?a=1#b') !== 'https://x.test/imarianus/') {
        return 'query and hash must not become part of the scope';
      }
      return null;
    });

  runEngineQueue();      /* start the serialized engine tests */
  runNetQueue();         /* start the serialized offline-queue tests */
  finish();
}());
</script>
</body>
</html>
