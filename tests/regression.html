<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>imarianus — regressiones</title>
<!--
  regression.html — framework-free browser regression harness (ES5).

  Open this file directly in a browser (file:// works, no server needed) and
  read the rows. Every check names the bug it guards, so a red row tells you
  which fix has been undone.

  Rule from the master plan: EVERY bug that gets fixed gets a case here that
  would have caught it. This page must be green before any commit that touches
  engine code.
-->
<style>
  body { margin: 0; padding: 24px; background: #f6e8c9; color: #3a2417;
         font-family: Palatino, Georgia, serif; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 18px; font-size: 14px; opacity: 0.75; }
  #summary { font-size: 18px; font-weight: bold; padding: 10px 14px;
             border-radius: 8px; margin-bottom: 16px; display: inline-block; }
  .allpass { background: #7fb069; color: #16240f; }
  .anyfail { background: #b33a2b; color: #fff2e8; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  td { border-bottom: 1px solid rgba(58,36,23,0.18); padding: 7px 9px;
       vertical-align: top; font-size: 14px; }
  td.st { width: 62px; font-weight: bold; text-align: center; color: #fff2e8; }
  td.st.pass { background: #7fb069; }
  td.st.fail { background: #b33a2b; }
  td.st.wait { background: #9c8a6a; }
  td.bug { width: 92px; font-family: Menlo, Consolas, monospace; font-size: 12px;
           opacity: 0.8; }
  td.detail { font-family: Menlo, Consolas, monospace; font-size: 12px;
              color: #7a3a2b; word-break: break-all; }
</style>
</head>
<body>
<h1>imarianus — regressiones</h1>
<p class="sub">Framework-free checks. Green page = safe to commit.</p>
<div id="summary" class="wait">currendo…</div>
<table><tbody id="rows"></tbody></table>

<!-- dependencies, in the same order index.html loads them.
     scenes.js has no dependencies of its own; game.js and boss.js depend on
     Scenes only (and on Game.beep being optional), so the three load cleanly
     without data.js, storage.js or the DOM app shell. -->
<script src="../js/scenes.js"></script>
<!-- the speaker. It boots nothing (it only asks speechSynthesis for a voice
     list, which is allowed to be empty) and it exports prep(), which is the
     last thing every utterance passes through — so GAUNTLET F5's "no verse
     slash may reach a voice" half is assertable here rather than by ear. -->
<script src="../js/tts.js"></script>
<script src="../js/game.js"></script>
<script src="../js/boss.js"></script>
<!-- M3 phase engine: boss.js is the engine + registry, these two fill it.
     Load order matters exactly as it does in index.html — boss-phases.js
     calls Boss.registerPhase and probatio.js calls Boss.createEngine. -->
<script src="../js/boss-phases.js"></script>
<script src="../js/probatio.js"></script>
<!-- M2 art files. They are pure registrations on top of scenes.js, so they
     load here for the same reason index.html loads them: the sweeps below
     must see the WHOLE actor library, not just the built-ins. A syntax
     error in any of them shows up as a missing actor in CHECK 6. -->
<script src="../js/actors-person.js"></script>
<script src="../js/actors-props.js"></script>
<script src="../js/backgrounds2.js"></script>
<!-- REAL content for the clamor derivation checks. A synthetic fixture can be
     made to pass any rule you write for it; the question that matters is what
     the deriver does to the Latin the learner is actually shown. The content
     file registers itself with CONTENT the moment it is injected, and
     CONTENT.region() is a plain registry read, so no manifest is needed. -->
<script src="../js/data-core.js"></script>
<!-- THE MANIFEST, BEFORE content-loader.js — which captures CONTENT_MANIFEST
     once, at evaluation time, so the order is load-bearing. NAV moved the
     track's shape (which regions exist, in what order, holding which
     capitula) into the manifest and out of the twelve content files, so the
     navigation rows below are asking the real index the app ships, not a
     fixture that could be made to agree with whatever the code does. -->
<script src="../content/manifest.js"></script>
<script src="../js/content-loader.js"></script>
<script src="../js/chip-lint.js"></script>
<script src="../content/fabulae-r01.js"></script>
<!-- M9 offline queue. storage.js + api.js are a PAIR here: the queue lives in
     storage.js but the event id is minted and replayed by api.js, and the bug
     class we are guarding (progress silently lost on a dead network) only
     exists at the seam between them. Loading them in index.html's order also
     proves storage.js survives being evaluated before Api exists. -->
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<!-- The overworld board. map.js is a pure renderer over scenes.js — it takes a
     model and returns an HTML string, and boots nothing — so it loads here
     exactly as it does in index.html and the POLISH-MAP rows below can call
     WorldMap.render() directly instead of screenshotting a phone. -->
<script src="../js/map.js"></script>

<script>
/* eslint-env browser */
(function () {
  'use strict';

  /* ================= tiny test runner ================= */

  var rowsEl = document.getElementById('rows');
  var summaryEl = document.getElementById('summary');
  var total = 0, failed = 0, pending = 0;

  /* add a row; returns a setter so async checks can fill it in later */
  function row(bug, name) {
    total++;
    var tr = document.createElement('tr');
    var st = document.createElement('td');
    st.className = 'st wait'; st.appendChild(document.createTextNode('…'));
    var bg = document.createElement('td'); bg.className = 'bug';
    bg.appendChild(document.createTextNode(bug));
    var nm = document.createElement('td');
    nm.appendChild(document.createTextNode(name));
    var dt = document.createElement('td'); dt.className = 'detail';
    tr.appendChild(st); tr.appendChild(bg); tr.appendChild(nm); tr.appendChild(dt);
    rowsEl.appendChild(tr);
    return function (ok, detail) {
      st.className = 'st ' + (ok ? 'pass' : 'fail');
      st.firstChild.nodeValue = ok ? 'PASS' : 'FAIL';
      dt.appendChild(document.createTextNode(detail || ''));
      if (!ok) { failed++; }
    };
  }

  /* synchronous check: fn() returns null/'' when fine, or a failure message */
  function check(bug, name, fn) {
    var set = row(bug, name);
    var msg;
    try { msg = fn(); } catch (e) { msg = 'threw: ' + (e && e.message ? e.message : e); }
    set(!msg, msg || 'ok');
  }

  /* asynchronous check: fn(done) calls done(msgOrNull) when finished */
  function checkAsync(bug, name, fn) {
    var set = row(bug, name);
    pending++;
    var settled = false;
    /* `detail` is what a PASSING check wants to say out loud — a sweep that
       reports "0 critical, 1561 warn" is worth more than another "ok".
       Optional and second, so every existing one-argument caller is unchanged. */
    function done(msg, detail) {
      if (settled) { return; }
      settled = true;
      set(!msg, msg || detail || 'ok');
      pending--;
      finish();
    }
    try { fn(done); } catch (e) { done('threw: ' + (e && e.message ? e.message : e)); }
  }

  function finish() {
    if (pending > 0) { return; }
    summaryEl.className = failed ? 'anyfail' : 'allpass';
    summaryEl.firstChild.nodeValue =
      failed ? (failed + ' / ' + total + ' FAILED') : ('OMNIA BENE — ' + total + ' / ' + total + ' pass');
  }

  /* ================= helpers ================= */

  var DATA_PREFIX = 'data:image/svg+xml;charset=utf-8,';

  /* recover the exact string the browser was asked to parse. This is the real
     bytes of the failing path, not a reconstruction of it. */
  function svgFromImage(img) {
    var src = String(img.src);
    if (src.indexOf(DATA_PREFIX) !== 0) {
      throw new Error('unexpected data URL prefix: ' + src.substring(0, 40));
    }
    return decodeURIComponent(src.substring(DATA_PREFIX.length));
  }

  /* returns a parsererror description, or null when the document is
     well-formed. A data:image/svg+xml URL is parsed as STRICT XML by the
     browser, which is why this mirrors the real decode path. */
  function xmlError(str) {
    var doc = new DOMParser().parseFromString(str, 'image/svg+xml');
    var errs = doc.getElementsByTagName('parsererror');
    if (errs && errs.length) {
      return String(errs[0].textContent).replace(/\s+/g, ' ').substring(0, 140);
    }
    if (!doc.documentElement) { return 'no document element'; }
    if (doc.documentElement.nodeName.toLowerCase() === 'parsererror') {
      return String(doc.documentElement.textContent).replace(/\s+/g, ' ').substring(0, 140);
    }
    return null;
  }

  function openingTag(str) {
    var a = str.indexOf('<svg');
    var b = str.indexOf('>', a);
    return (a < 0 || b < 0) ? '' : str.substring(a, b + 1);
  }

  function countAttr(tag, name) {
    var m = tag.match(new RegExp('\\s' + name + '\\s*=', 'gi'));
    return m ? m.length : 0;
  }

  /* the full FIX-1a contract for one produced string */
  function assertSized(label, str) {
    var err = xmlError(str);
    if (err) { return label + ': NOT well-formed XML — ' + err; }
    var tag = openingTag(str);
    if (!tag) { return label + ': no opening <svg> tag'; }
    var nw = countAttr(tag, 'width'), nh = countAttr(tag, 'height');
    if (nw !== 1 || nh !== 1) {
      return label + ': expected exactly 1 width + 1 height on the root, got ' +
        nw + ' + ' + nh + ' — ' + tag.substring(0, 120);
    }
    return null;
  }

  /* ================= CHECK 1 =================
     Guards BUG-1 / FIX-1a — the boss-fight freeze.
     boss.js used to prepend width/height to an <svg ...> string that already
     carried them (Scenes.mascot does). A duplicate attribute is a FATAL XML
     well-formedness error, so the data: URL never decoded, the Image sat in
     the "broken" state with .complete === true, and drawImage() threw
     InvalidStateError inside draw() — killing the animation loop.
     Every actor sprite, the mascot and a full scene must survive toImage(). */

  check('BUG-1', 'toImage(Scenes.mascot(80), 80) is well-formed with one width/height',
    function () {
      /* the exact string that crashed the boss fight: mascot() emits its own
         width/height, so this is the duplicate-attribute case itself. */
      return assertSized('mascot', svgFromImage(Scenes.toImage(Scenes.mascot(80), 80)));
    });

  check('BUG-1', 'toImage() over EVERY actor sprite in the library',
    function () {
      var names = Scenes.actorNames(), i, msg;
      if (!names.length) { return 'actor registry is empty'; }
      for (i = 0; i < names.length; i++) {
        /* sprite() already writes width/height, so toImage() must strip them */
        msg = assertSized('actor ' + names[i],
          svgFromImage(Scenes.toImage(Scenes.sprite(names[i], {}, 120), 64)));
        if (msg) { return msg; }
      }
      return null;
    });

  check('BUG-1', 'toImage() over a full Scenes.render() scene (game.js path)',
    function () {
      var svg = Scenes.render({ bg: 'forest', items: [
        { t: 'fox', x: 140, y: 210, s: 1 },
        { t: 'tree', x: 300, y: 210, s: 1, grapes: true }
      ], bubbles: [{ x: 200, y: 40, text: 'Ecce!', tail: 'left' }] });
      return assertSized('scene', svgFromImage(Scenes.toImage(svg, 60)));
    });

  check('BUG-1', 'sizeSvg() is idempotent (re-sizing never duplicates attributes)',
    function () {
      /* the failure mode was a SECOND sizing pass over an already sized
         string, so sizing twice must still yield exactly one pair. */
      var once = Scenes.sizeSvg(Scenes.mascot(80), 40);
      var twice = Scenes.sizeSvg(once, 90);
      var msg = assertSized('sized twice', twice);
      if (msg) { return msg; }
      if (twice.indexOf('width="90"') < 0 || twice.indexOf('height="90"') < 0) {
        return 'the last size did not win: ' + openingTag(twice).substring(0, 120);
      }
      return null;
    });

  check('BUG-1', 'sizeSvg() strips only the opening tag and spares stroke-width',
    function () {
      var src = '<svg width="9" height="9" viewBox="0 0 10 10" stroke-width="3">' +
                '<rect width="10" height="10" stroke-width="2"/></svg>';
      var out = Scenes.sizeSvg(src, 50);
      var msg = assertSized('handmade', out);
      if (msg) { return msg; }
      if (out.indexOf('<rect width="10" height="10" stroke-width="2"/>') < 0) {
        return 'the element body was damaged: ' + out;
      }
      if (openingTag(out).indexOf('stroke-width="3"') < 0) {
        return 'stroke-width was eaten off the root: ' + openingTag(out);
      }
      return null;
    });

  /* ================= CHECK 2 =================
     Guards BUG-2 — the wolf letterboxed in an opaque square.
     makeWolfImage() used to render a whole {bg:'plain'} 400x240 scene and
     squeeze it into 200x200, so the scene's sky and ground painted an opaque
     rectangle across the middle of the arena. Scenes.sprite must draw the
     actor ALONE on a transparent, tight viewBox. */

  function fullSizeRect(str) {
    var doc = new DOMParser().parseFromString(str, 'image/svg+xml');
    var root = doc.documentElement;
    var vb = String(root.getAttribute('viewBox') || '').split(/[\s,]+/);
    var vbW = parseFloat(vb[2]), vbH = parseFloat(vb[3]);
    var rects = doc.getElementsByTagName('rect');
    var i, w, h;
    for (i = 0; i < rects.length; i++) {
      w = String(rects[i].getAttribute('width') || '0');
      h = String(rects[i].getAttribute('height') || '0');
      w = (w.indexOf('%') > 0) ? vbW * parseFloat(w) / 100 : parseFloat(w);
      h = (h.indexOf('%') > 0) ? vbH * parseFloat(h) / 100 : parseFloat(h);
      if (w >= vbW && h >= vbH) { return 'rect ' + w + 'x' + h + ' over viewBox ' + vbW + 'x' + vbH; }
    }
    return null;
  }

  check('BUG-2', "Scenes.sprite('wolf', {}, 200): well-formed, no background rect",
    function () {
      var svg = Scenes.sprite('wolf', {}, 200);
      var msg = assertSized('wolf sprite', svg);
      if (msg) { return msg; }
      var bg = fullSizeRect(svg);
      if (bg) { return 'sprite paints an opaque background: ' + bg; }
      if (svg.indexOf('#f6e8c9') >= 0 || svg.indexOf('#b98a4e') >= 0) {
        return 'sprite contains scene sky/ground colours — a background leaked in';
      }
      return null;
    });

  check('BUG-2', 'no actor sprite paints a full-viewBox background',
    function () {
      var names = Scenes.actorNames(), i, bg;
      for (i = 0; i < names.length; i++) {
        bg = fullSizeRect(Scenes.sprite(names[i], {}, 100));
        if (bg) { return 'actor ' + names[i] + ' paints a background: ' + bg; }
      }
      return null;
    });

  check('BUG-2', 'sprite() passes opts through (pose changes the output)',
    function () {
      /* a pose that produced identical markup would mean opts are dropped */
      if (Scenes.sprite('wolf', { pose: 'angry' }, 100) === Scenes.sprite('wolf', { pose: 'stand' }, 100)) {
        return 'pose:"angry" and pose:"stand" render identically';
      }
      return null;
    });

  /* ================= CHECK 3 =================
     Guards the register() extension point used by the art files
     (actors-person.js, actors-props.js, backgrounds2.js). A registered actor
     must behave exactly like a built-in inside Scenes.render, receiving the
     spec item as its opts. */

  check('API', 'register() round-trip: dummy actor renders inside a scene',
    function () {
      var seen = null;
      var ok = Scenes.register('__dummy__', function (opts) {
        seen = opts;                       /* opts must be the spec item */
        return '<circle cx="0" cy="0" r="5" fill="#123456"/>';
      }, { x: -6, y: -6, w: 12, h: 12 });
      if (!ok) { return 'register() refused a valid actor'; }

      var svg = Scenes.render({ bg: 'plain', items: [
        { t: '__dummy__', x: 100, y: 200, s: 2, pose: 'testPose', flip: true }
      ] });
      if (svg.indexOf('#123456') < 0) { return 'registered actor did not render into the scene'; }
      if (!seen || seen.pose !== 'testPose') { return 'opts were not passed through to the draw fn'; }
      if (svg.indexOf('scale(-1,1)') < 0) { return 'flip was not applied to the registered actor'; }

      var msg = xmlError(svg);
      if (msg) { return 'scene with a registered actor is malformed: ' + msg; }

      /* the registered actor must also work through sprite() + toImage() */
      msg = assertSized('dummy sprite', svgFromImage(Scenes.toImage(Scenes.sprite('__dummy__', {}, 80), 80)));
      if (msg) { return msg; }

      /* registerBg likewise */
      if (!Scenes.registerBg('__dummybg__', function () { return '<rect width="400" height="240" fill="#654321"/>'; })) {
        return 'registerBg() refused a valid background';
      }
      if (Scenes.render({ bg: '__dummybg__', items: [] }).indexOf('#654321') < 0) {
        return 'registered background did not render';
      }
      return null;
    });

  check('API', 'unknown / inherited actor names never reach a function call',
    function () {
      /* ACTORS is an object literal, so a naive ACTORS[name] lookup would
         return Object.prototype members for these and call them as actors. */
      var svg = Scenes.render({ bg: 'plain', items: [
        { t: 'constructor', x: 10, y: 10 },
        { t: 'toString', x: 20, y: 20 },
        { t: 'nonexistentActor', x: 30, y: 30 }
      ] });
      return xmlError(svg) ? ('scene broke on inherited keys: ' + xmlError(svg)) : null;
    });

  /* ================= CHECK 4 =================
     Guards BUG-5(b) — abort() must tear the fight down WITHOUT reporting a
     result. It used to call end(false), so merely navigating away from the
     boss screen fired cb.onEnd(false) and showed the "you lost" screen.
     Also covers BUG-5(a): no frame may run after teardown. */

  checkAsync('BUG-5', 'Boss.abort() tears down without firing onEnd', function (done) {
    var canvas = document.createElement('canvas');
    var words = [{ la: 'lupus', emoji: '🐺' }, { la: 'agnus', emoji: '🐑' }];
    var ended = false;
    Boss.start(canvas, { words: words, hp: 3, seconds: 30 }, {
      onEnd: function () { ended = true; }
    });
    Boss.abort();
    /* wait several frames: a stale rAF would land inside this window */
    window.setTimeout(function () {
      done(ended ? 'abort() fired onEnd — navigating away reports a defeat' : null);
    }, 200);
  });

  /* ================= CHECK 5 =================
     Guards FIX-1b — WHY the drawImage guard must test naturalWidth.
     A broken image reports .complete === true; only naturalWidth === 0 gives
     it away. Any future `if (img.complete)` guard is therefore still a crash
     waiting to happen, and this row exists to say so out loud. */

  checkAsync('BUG-1', 'a broken image still reports complete=true (naturalWidth is the only tell)',
    function (done) {
      /* deliberately malformed: <rect> is never closed, so the XML parser
         rejects the document exactly as a duplicate attribute would. */
      var bad = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10">' +
                '<rect width="10" height="10" fill="#000"></svg>';
      var img = Scenes.toImage(bad, 40);
      function verdict() {
        if (img.naturalWidth > 0) { return done('the malformed fixture decoded anyway — fixture is stale'); }
        if (!img.complete) { return done('image never settled (slow environment?)'); }
        return done(null);
      }
      img.onload = verdict;
      img.onerror = verdict;
      /* belt and braces: some engines fire neither handler for a failed
         data: URL, but .complete still flips. */
      window.setTimeout(verdict, 600);
    });

  /* ================= CHECK 6 =================
     Guards the M2 art library (actors-person.js, actors-props.js,
     backgrounds2.js). These files are ~90 registrations of hand-written
     SVG path data, and the failure modes are silent: a stray quote makes
     a malformed sprite that decodes to nothing, a missed bounds entry
     makes sprite() fall back to a generic box that crops the artwork, and
     a syntax error anywhere in a file drops EVERY actor it registers
     without a single console message reaching the game.

     That last one is not hypothetical: an unterminated block comment in
     actors-person.js during M2 removed 'person' and 'crowdGroup' from the
     library, and the only symptom was empty cells in the gallery. */

  /* the exact DEFAULT_BOUNDS literal in scenes.js. A sprite whose viewBox
     equals it did NOT bring its own bounds. (An actor that legitimately
     measured to this box would be a false positive — none does, and the
     row names the actor so it takes seconds to confirm.) */
  var FALLBACK_VIEWBOX = '-60 -130 120 140';

  function viewBoxOf(svg) {
    var m = /viewBox="([^"]+)"/.exec(String(svg));
    return m ? m[1].replace(/\s+/g, ' ') : '';
  }

  check('M2-ART', 'the three art files all loaded (a syntax error drops a whole file silently)',
    function () {
      var need = ['person', 'crowdGroup', 'leo', 'ark', 'ship', 'murusAquae',
        'arborNuda', 'nidus'];
      var have = {}, names = Scenes.actorNames(), i, missing = [];
      for (i = 0; i < names.length; i++) { have[names[i]] = true; }
      for (i = 0; i < need.length; i++) { if (!have[need[i]]) { missing.push(need[i]); } }
      if (missing.length) { return 'missing actors: ' + missing.join(', '); }
      var bgs = Scenes.bgNames().join(' ');
      if (bgs.indexOf('stabulum') < 0 || bgs.indexOf('stormSea') < 0 || bgs.indexOf('hiems') < 0) {
        return 'backgrounds2.js did not register: ' + bgs;
      }
      return null;
    });

  check('M2-ART', 'EVERY registered actor produces a well-formed sprite',
    function () {
      var names = Scenes.actorNames(), i, msg;
      for (i = 0; i < names.length; i++) {
        if (names[i].indexOf('__') === 0) { continue; }   /* test fixtures */
        msg = assertSized('sprite ' + names[i], Scenes.sprite(names[i], {}, 140));
        if (msg) { return msg; }
      }
      return null;
    });

  check('M2-ART', 'EVERY registered actor carries its own bounds (no DEFAULT_BOUNDS hits)',
    function () {
      var names = Scenes.actorNames(), i, vb, bad = [];
      for (i = 0; i < names.length; i++) {
        if (names[i].indexOf('__') === 0) { continue; }
        vb = viewBoxOf(Scenes.sprite(names[i], {}, 100));
        if (!vb) { return 'actor ' + names[i] + ' produced a sprite with no viewBox'; }
        if (vb === FALLBACK_VIEWBOX) { bad.push(names[i]); }
      }
      if (bad.length) {
        return bad.length + ' actor(s) registered without bounds, so sprite() crops them ' +
          'with the generic fallback box: ' + bad.join(', ');
      }
      return null;
    });

  check('M2-ART', 'EVERY registered background renders a well-formed scene',
    function () {
      var bgs = Scenes.bgNames(), i, svg, err;
      for (i = 0; i < bgs.length; i++) {
        if (bgs[i].indexOf('__') === 0) { continue; }
        svg = Scenes.render({ bg: bgs[i], items: [] });
        err = xmlError(svg);
        if (err) { return 'background ' + bgs[i] + ' is malformed: ' + err; }
        if (svg.indexOf('NaN') >= 0 || svg.indexOf('undefined') >= 0) {
          return 'background ' + bgs[i] + ' emitted NaN/undefined into its path data';
        }
      }
      return null;
    });

  check('M2-ART', 'every person role and pose renders without NaN in its path data',
    function () {
      /* NaN in a path is the classic arithmetic-typo signature: the browser
         drops the whole path silently and a limb just disappears. */
      var roles = ['patriarch', 'shepherd', 'king', 'queen', 'soldier', 'priest',
        'child', 'woman', 'man', 'crowd', 'angel'];
      var poses = ['stand', 'walk', 'kneel', 'arms-up', 'point', 'sit', 'sleep', 'carry'];
      var r, p, svg, msg;
      for (r = 0; r < roles.length; r++) {
        for (p = 0; p < poses.length; p++) {
          svg = Scenes.sprite('person', { role: roles[r], pose: poses[p] }, 120);
          if (svg.indexOf('NaN') >= 0 || svg.indexOf('undefined') >= 0) {
            return 'person ' + roles[r] + '/' + poses[p] + ' emitted NaN/undefined';
          }
          msg = assertSized('person ' + roles[r] + '/' + poses[p], svg);
          if (msg) { return msg; }
        }
      }
      return null;
    });

  check('M2-ART', 'animal poses (walk/lie/eat/run) stay well-formed on the shared cores',
    function () {
      var animals = ['leo', 'ursus', 'canis', 'feles', 'asinus', 'equus', 'bos', 'cervus',
        'hircus', 'haedus', 'camelus', 'lepus', 'mus'];

     THE BUG, in the owner's words: "Some drawings suck, like 'mulier': it
     seems like an old man with beard!!"

     He was right and the cause was geometry, not taste. `person`'s veil was
     two shapes: an arch over the crown, and a slab drawn BEHIND the skull
     that ran from cy-2 down to cy+26 and out to x=13 — straight across the
     jaw, past the collar, onto the chest. On a 96px card (~0.8 px per local
     unit) a pale mass hanging under a chin is a beard and nothing else, so
     every veiled figure in the book — mulier, Eva, Sara, Rebecca, Rachēl,

     band that is measuring the wrong part of the figure. */

  /* map a local drawing coordinate to a pixel of the rasterised sprite.
     sprite() letterboxes with preserveAspectRatio="xMidYMid meet", so the
     browser's transform is reproduced here rather than guessed. */
  function spriteMapper(svg, px) {

    return function (x, y) { return [(x - vx) * k + ox, (y - vy) * k + oy]; };
  }

     COLOUR is a fill and nothing else, so recolouring it does not move one
     unit of the geometry, and pure blue is a value no other part of this

        i = (py * w + px) * 4;

    { name: 'woman · kneel', o: { role: 'woman', pose: 'kneel' } },
    { name: 'woman · sit', o: { role: 'woman', pose: 'sit' } },
    { name: 'woman · arms-up', o: { role: 'woman', pose: 'arms-up' } },
    { name: 'queen (Dīdō, Iūnō, Amāta)', o: { role: 'queen' } },

    function (done) {

      cv.width = PX; cv.height = PX;
      var ctx = cv.getContext('2d');
      if (!ctx) { return done('no 2d context in this browser'); }

      function next() {
        if (idx >= ART3_FIGURES.length) {
          return done(results.length ? results.join(' | ') : null);
        }
        var fig = ART3_FIGURES[idx++];
        var o = {}, k;
        for (k in fig.o) { if (Object.prototype.hasOwnProperty.call(fig.o, k)) { o[k] = fig.o[k]; } }
        o.veil = true;
        o.veilColor = '#0000ff';
        var svg = Scenes.sprite('person', o, PX);
        var map = spriteMapper(svg, PX);
        var shY = ART3_SHY[o.pose || 'stand'];
        var headY = shY - 16;
        var img = Scenes.toImage(svg, PX);

          var data;
          ctx.clearRect(0, 0, PX, PX);
          ctx.drawImage(img, 0, 0, PX, PX);
          try {
            data = ctx.getImageData(0, 0, PX, PX).data;
          } catch (e) {
            return done('the canvas is tainted, so this row cannot sample: ' + e.message);
          }
          /* CONTROL 1 — the veil is really on the head. Without this the
             two counts below would both be zero if the veil silently vanished
             (or if the coordinate mapping drifted) and the row would pass.
             Sampled at the BACK SIDE of the arch, between the skull edge and
             the veil's outer edge, because a queen's gold crown sits on top
             of the crown of the veil and would hide it there. */
          if (blueCount(data, PX, map, -11.4, headY - 1, -9.2, headY + 4) < 8) {

             half of what makes the female silhouette read at 40px. */
          if (blueCount(data, PX, map, -18, shY + 6, 18, shY + 20) < 8) {
            results.push(fig.name + ': the veil no longer falls below the shoulders');
          }

             skull reaches headY+9.21) to a full unit ABOVE the shoulder line,
             full width. The old back-drape filled it edge to edge; that is

          var beard = blueCount(data, PX, map, -20, headY + 9.6, 20, shY - 1);

          }
          next();
        };
        img.onerror = function () { done(fig.name + ': the sprite would not decode'); };
      }
      next();
    });

  /* ================= M9 — OFFLINE QUEUE, PWA =================
     Guards brief §8: "students are on phones with unreliable connections;
     today they silently lose progress". The checks below are the contract:
     an action taken offline is kept, replayed in order, and carries the same
     event id it was born with (without which a replay double-pays XP). */

  /* These tests share ONE global: localStorage['mariane_queue_v1']. Two of
     them in flight at once would each be clearing and filling the other's
     queue, so they are serialized exactly like the engine tests above —
     rows appear immediately, execution happens one at a time. */
  var netQueue = [];
  function checkNet(bug, name, fn) {
    var set = row(bug, name);
    pending++;
    netQueue.push(function () {
      var settled = false;
      function done(msg) {
        if (settled) { return; }
        settled = true;
        set(!msg, msg || 'ok');
        pending--;
        runNetQueue();
        finish();
      }
      try { fn(done); } catch (e) { done('threw: ' + (e && e.message ? e.message : e)); }
    });
  }
  function runNetQueue() {
    var next = netQueue.shift();
    if (next) { next(); }
  }

     check that calls this MUST call restore(), including on failure. */
  function stubApi(onReplay) {
    var realReplay = Api.replay, realGetCsrf = Api.getCsrf;
    Api.replay = onReplay;
    Api.getCsrf = function () { return 'test-csrf'; };   /* flush() waits for one */
    return function () {
      Api.replay = realReplay;
      Api.getCsrf = realGetCsrf;
      Storage.setOffline(false);
      Storage.clearQueue();
    };
  }

  /* ================= M9 — PWA =================
     These four need a SERVER (fetch of ../sw.js etc.), which is how the site
     actually runs. Opened over file:// they report a skip rather than a red
     row, because a red row nobody can fix is noise. */

  var SERVED = window.location.protocol !== 'file:';

  /* read a project file as text. Several rows below assert things about
     SOURCE that cannot be observed by running it (that app.js calls a
     function at all, that qa.html seeds from the manifest). cb(err, text). */
  function fetchText(path, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', path, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status < 200 || xhr.status >= 300) { cb('HTTP ' + xhr.status, null); return; }
      cb(null, xhr.responseText);
    };
    xhr.send(null);
  }

  /* sw.js is never executed here — a service worker cannot run in a page
     context — so this is a SYNTAX gate: fetch the bytes the browser would be
     asked to install and hand them to the JS parser via new Function. A typo
     in sw.js otherwise shows up only as "install failed" in a console the
     owner will never open. */
  checkAsync('M9-PWA', 'sw.js parses as JavaScript and declares a VERSION',
    function (done) {
      if (!SERVED) { done(null); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '../sw.js', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) { return; }
        if (xhr.status < 200 || xhr.status >= 300) {
          done('sw.js did not load: HTTP ' + xhr.status); return;
        }
        var src = xhr.responseText;
        try {
          /* wrapped so its top-level `self` references are merely referenced,
             never evaluated: parsing is the whole point */
          new Function('self', src);
        } catch (e) {
          done('sw.js is not parseable: ' + (e && e.message ? e.message : e));
          return;
        }
        if (!/var\s+VERSION\s*=/.test(src)) {
          done('sw.js has no VERSION constant — nothing would ever cache-bust');
          return;
        }
        if (src.indexOf('/server/') < 0) {
          done('sw.js no longer excludes /server/ — the API must never be cached');
          return;
        }
        done(null);
      };
      xhr.send(null);
    });

  checkAsync('M9-PWA', 'manifest.webmanifest parses and names the right shape',
    function (done) {
      if (!SERVED) { done(null); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '../manifest.webmanifest', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) { return; }
        if (xhr.status < 200 || xhr.status >= 300) {
          done('manifest did not load: HTTP ' + xhr.status); return;

        try { m = JSON.parse(xhr.responseText); }
        catch (e) { done('manifest is not valid JSON: ' + e.message); return; }
        if (m.lang !== 'la') { return done('lang must be "la", got ' + m.lang); }
        if (!m.name || m.name.indexOf('MARIANE') !== 0) {
          return done('name should start with MARIANE, got ' + m.name);
        }
        if (m.theme_color !== '#2b1c16' || m.background_color !== '#2b1c16') {
          return done('colours drifted from --wall in styles.css: ' +
                      m.theme_color + ' / ' + m.background_color);

        if (m.start_url !== './' || m.scope !== './') {

                      m.start_url + ' / ' + m.scope);
        }
        if (!m.icons || m.icons.length < 2) { return done('fewer than 2 icons'); }
        var maskable = false, i;
        for (i = 0; i < m.icons.length; i++) {

     Guards BUG-3 — the FĀBULA crash on a page without `nova`.
     app.js read `line.nova.length` straight out of the story page, but the

     in that file lives inside one IIFE at TWO-space indentation, so a line
     that is exactly "  }" closes a top-level function and nothing else — a
     nested block always closes deeper. Deliberately not a brace counter:
     app.js contains regex literals holding quotes (`.replace(/"/g, …)`),
     which is precisely what a naive scanner gets wrong. */

  /* ---- POLISH-TILE ----
     A probatio/duel tile is 52–58 px. Drawing a 400x240 SCENE into it left
     the animal about 14 px across, so `ovis`, `bōs` and `camēlus` were three
     identical beige smudges and ORDINA became a guessing game. drawTile now
     asks tileImage(), which takes the tight Scenes.sprite() crop whenever the
     scene is exactly one registered actor and keeps the raster otherwise
     (a two-actor scene is a composition: cropping `pāstor` to its flock
     deletes the shepherd the word names).

     The engine is real: the probe registers a phase, lets the engine hand it
     the same `env` every shipped phase gets, and asks that env for the two
     images. No canvas sampling — an SVG-backed Image decodes asynchronously,
     so a pixel test here would be a coin toss. The data: URI IS the answer:
     a sprite carries the actor's own tight viewBox, a scene carries 0 0 400
     240. */
  Boss.registerPhase('__tileprobe', {
    titulus: 'PROBE',
    /* whenPhase() below waits on impl.env, exactly as the shipped phases in
       js/boss-phases.js expose it */
    init: function (env) { this.env = env; },
    update: function () {}, draw: function () {},
    teardown: function () { this.env = null; }
  });

  function srcViewBox(img) {
    if (!img || !img.src) { return null; }
    var svg = decodeURIComponent(img.src.replace(/^data:image\/svg\+xml;charset=utf-8,/, ''));
    var m = /viewBox="([^"]+)"/.exec(svg);
    return m ? m[1].replace(/\s+/g, ' ') : null;

        if (!/<g class="mm-parallax" filter="url\(#mmCarved\)"/.test(html)) { return 'unfiltered'; }
        return [+m[1], +m[2], +m[3], +m[4], +m[5], +m[6]].join(',');
      }
      var seen = {}, tracks = ['fabulae', 'historia', 'aeneis'], i, r;
      for (i = 0; i < tracks.length; i++) {
        r = ramp(tracks[i]);
        if (!r) { return tracks[i] + ': no mmCarved filter in the board'; }
        if (r === 'unfiltered') { return tracks[i] + ': the scenery layer is not carved at all'; }
        if (r !== (WorldMap.TINTS[tracks[i]].carve || []).join(',')) {
          return tracks[i] + ': the filter ramp (' + r + ') is not the tint\'s carve ramp';
        }
        if (seen[r]) { return tracks[i] + ' shares its prop ramp with ' + seen[r] + ' — the boards look alike again'; }
        seen[r] = tracks[i];
      }
      return null;
    });

  /* ============================================================
     NAV — the continuous track board
     ------------------------------------------------------------
     THE BUG: the app rendered ONE region's map and had no UI to reach any
     other. After beating a region's boss the learner stood on a gold summit
     with no road off it; 142 capitula shipped and only each track's FIRST
     board was ever reachable. It was found on the live site.

     The rows below guard the three pieces of the fix, and each is written
     to fail loudly the way the bug failed quietly.
     ============================================================ */

  /* build the board model the app builds, from the REAL manifest, with a
     progress predicate the caller supplies. Mirrors trackModel() in
     js/app.js closely enough that a divergence in the SHAPE shows up here. */
  function navBoard(trackId, isDone) {
    isDone = isDone || function () { return false; };
    var es = CONTENT.regionEntries(trackId), segs = [], i, j;
    for (i = 0; i < es.length; i++) {
      var caps = es[i].capitula || [], total = caps.length + (es[i].boss ? 1 : 0);
      var nodes = [], allDone = caps.length > 0;
      for (j = 0; j < caps.length; j++) {
        if (!isDone(caps[j])) { allDone = false; }
        nodes.push({ id: caps[j], kind: 'fable',
                     x: (j % 2 === 0) ? 0.28 : 0.71,
                     y: 0.87 - j * (total > 1 ? 0.71 / (total - 1) : 0),
                     label: CONTENT.roman(CONTENT.capNumber(trackId, caps[j])),
                     titulus: '', state: isDone(caps[j]) ? 'done' : 'shut' });
      }
      if (es[i].boss) {
        nodes.push({ id: es[i].boss, kind: 'boss', x: 0.5, y: 0.16, label: '👑',
                     titulus: '', state: allDone ? 'open' : 'shut' });
      }
      segs.push({ id: es[i].id, titulus: CONTENT.regionTitulus(trackId, es[i].id),
                  numeral: CONTENT.roman(i + 1), locked: i > 0, cleared: false,
                  capsDone: 0, capsTotal: caps.length, nodes: nodes });
    }
    return { segments: segs, foxNode: (segs[0] && segs[0].nodes[0]) ? segs[0].nodes[0].id : '',
             track: trackId, titulus: trackId, avatar: 'fox' };
  }

  /* ---- NAV — every region is ON the board ---- */
  check('NAV-BOARD', 'one board per track carries EVERY region\'s capitula and boss, regiō I lowest',
    function () {
      if (!window.CONTENT_MANIFEST) { return 'the manifest is not loaded — the board cannot be checked'; }
      var tracks = ['fabulae', 'historia', 'aeneis'], t, i, j;
      for (t = 0; t < tracks.length; t++) {
        var tr = tracks[t];
        var es = CONTENT.regionEntries(tr);
        if (!es.length) { return tr + ' has no regions in the manifest'; }
        var model = navBoard(tr);
        var html = WorldMap.render(model);
        var L = WorldMap.layout(model);

        /* 1. every id the manifest declares is a tile on the board. This is
              the bug itself: before the fix only region one was drawn. */
        var want = 0;
        for (i = 0; i < es.length; i++) {
          var caps = es[i].capitula || [];
          for (j = 0; j < caps.length; j++) {
            want++;
            if (html.indexOf('data-id="' + caps[j] + '"') < 0) {
              return tr + ': ' + caps[j] + ' (' + es[i].id + ') is not on the board';
            }
          }
          if (es[i].boss) {
            want++;
            if (html.indexOf('data-id="' + es[i].boss + '"') < 0) {
              return tr + ': the boss ' + es[i].boss + ' is not on the board';
            }
          }
          /* 2. and each region announces itself with a title band */
          if (html.indexOf('data-region="' + es[i].id + '"') < 0) {
            return tr + ': region ' + es[i].id + ' has no title band';
          }
        }
        if (L.pts.length !== want) {
          return tr + ': the board laid out ' + L.pts.length + ' nodes, not ' + want;
        }

        /* 3. ORDER + CONTINUITY. The nodes are in walking order and the
              board is drawn bottom-up, so y must fall monotonically from
              the first capitulum of regiō I to the last boss — INCLUDING
              across every region seam. A break here is a path ribbon that
              doubles back, which is what a stack of unconnected cards
              would look like. */
        for (i = 1; i < L.pts.length; i++) {
          if (L.pts[i].y >= L.pts[i - 1].y) {
            return tr + ': the path stops climbing at ' + L.pts[i].id +
                   ' (y ' + L.pts[i].y + ' after ' + L.pts[i - 1].y + ')';
          }
        }
        if (L.bands.length !== es.length) {
          return tr + ': ' + L.bands.length + ' title bands for ' + es.length + ' regions';
        }

        /* 4. REGIŌ I IS AT THE FOOT. Monotonic y proves the ribbon never
              doubles back, but it would hold just as well for a board
              stacked upside down — layout() draws whatever order it is
              handed. So name the two ends: the manifest's first capitulum
              must be the lowest tile and its last node the highest. */
        var firstId = (es[0].capitula || [])[0];
        var lastRegion = es[es.length - 1];
        var lastId = lastRegion.boss ||
          (lastRegion.capitula || [])[(lastRegion.capitula || []).length - 1];
        if (L.pts[0].id !== firstId) {
          return tr + ': the board starts at ' + L.pts[0].id + ', not at ' + firstId;
        }
        if (L.pts[L.pts.length - 1].id !== lastId) {
          return tr + ': the summit is ' + L.pts[L.pts.length - 1].id + ', not ' + lastId;
        }
        for (i = 0; i < L.pts.length; i++) {
          if (L.pts[i].y > L.pts[0].y) {
            return tr + ': ' + L.pts[i].id + ' is drawn below regiō I';
          }
        }
      }
      return null;
    });

  /* ---- NAV — the auto-advance ---- */
  check('NAV-ADVANCE', 'clearing a boss hands back the NEXT region\'s first capitulum, and \'\' at a track\'s end',
    function () {
      if (!window.CONTENT_MANIFEST) { return 'the manifest is not loaded'; }
      var tracks = ['fabulae', 'historia', 'aeneis'], t, i;
      for (t = 0; t < tracks.length; t++) {
        var tr = tracks[t], es = CONTENT.regionEntries(tr);
        for (i = 0; i < es.length; i++) {
          var got = CONTENT.nextNodeAfterBoss(tr, es[i].id);
          if (i + 1 < es.length) {
            var want = (es[i + 1].capitula || [])[0];
            if (got !== want) {
              return tr + '/' + es[i].id + ': advanced to "' + got + '", not to ' + want;
            }
            /* THE POINT: it crosses the region boundary. A node that is
               still inside the region just cleared is the stranding bug. */
            if ((es[i].capitula || []).indexOf(got) >= 0) {
              return tr + '/' + es[i].id + ': advanced to a node inside the SAME region';
            }
          } else if (got !== '') {
            return tr + ': the last region advanced to "' + got + '" instead of stopping';
          }
        }
      }
      /* r01 → r02 is the exact journey the owner could not make */
      if (CONTENT.nextNodeAfterBoss('fabulae', 'r01') !== 'f4') {
        return 'beating Lupus in Silva still does not lead to f4';
      }
      return null;
    });

  /* ---- NAV — the unlock rule the SERVER enforces ----
     server/lib/progress.php gates a step on "the previous capitulum IN THE
     SAME TRACK is fully complete" (rule_fable_prev) and answers 409 when it
     is not. A client that disagreed would offer a lesson the server then
     refuses — a locked door that looks open, which fails silently. */
  check('NAV-UNLOCK', 'the prerequisite chain is per-track, unbroken across regions, and open only at a track\'s head',
    function () {
      if (!window.CONTENT_MANIFEST) { return 'the manifest is not loaded'; }
      var tracks = ['fabulae', 'historia', 'aeneis'], t, i;
      var seen = {};
      for (t = 0; t < tracks.length; t++) {
        var tr = tracks[t], chain = CONTENT.trackCapitula(tr);
        if (!chain.length) { return tr + ' has no capitula'; }
        if (CONTENT.prevCapitulumId(tr, chain[0]) !== null) {
          return tr + ': its first capitulum has a prerequisite';
        }
        for (i = 1; i < chain.length; i++) {
          if (CONTENT.prevCapitulumId(tr, chain[i]) !== chain[i - 1]) {
            return tr + ': ' + chain[i] + ' does not follow ' + chain[i - 1];
          }
          /* the seam that matters: the first capitulum of every region
             AFTER the first must depend on the region before it */
          var loc = CONTENT.locate(chain[i]);
          var prevLoc = CONTENT.locate(chain[i - 1]);
          if (loc.track !== tr || prevLoc.track !== tr) {
            return tr + ': the chain leaked into another track at ' + chain[i];
          }
        }
        for (i = 0; i < chain.length; i++) {
          if (seen[chain[i]]) { return chain[i] + ' appears in two tracks'; }
          seen[chain[i]] = tr;
        }
      }
      /* 142 capitula is the number that shipped and the number that must be
         reachable — the bug left 3 + 5 + 4 of them behind one door each */
      var total = 0;
      for (t = 0; t < tracks.length; t++) { total += CONTENT.trackCapitula(tracks[t]).length; }
      if (total !== 142) { return 'the three tracks hold ' + total + ' capitula, not 142'; }
      return null;
    });

  /* ---- NAV — the region index has something to list ----
     The index names every region of the track, and a LOCKED region is named
     too: a padlock beside a name is a promise, a padlock beside nothing is
     a wall. The names live in the manifest precisely so a region nobody has
     downloaded can still be listed. */
  check('NAV-INDEX', 'every region of every track is nameable and countable without loading its content file',
    function () {
      if (!window.CONTENT_MANIFEST) { return 'the manifest is not loaded'; }
      var tracks = ['fabulae', 'historia', 'aeneis'], t, i, n = 0;
      for (t = 0; t < tracks.length; t++) {
        var tr = tracks[t], es = CONTENT.regionEntries(tr);
        for (i = 0; i < es.length; i++) {
          n++;
          var tit = CONTENT.regionTitulus(tr, es[i].id);
          if (!tit) { return tr + '/' + es[i].id + ' has no titulus — the index would list a blank row'; }
          if (!(es[i].capitula || []).length) { return tr + '/' + es[i].id + ' lists no capitula'; }
          if (!CONTENT.regionProgressId(tr, es[i].id)) {
            return tr + '/' + es[i].id + ' has no progress id, so its boss tick cannot be read';
          }
          if (CONTENT.roman(i + 1).length === 0) { return 'no numeral for ' + es[i].id; }
        }
      }
      if (n !== 33) { return 'the manifest names ' + n + ' regions, not 33'; }
      /* r01's server rows say 'region1' and always will (content/README §5) */
      if (CONTENT.regionProgressId('fabulae', 'r01') !== 'region1') {
        return 'r01 lost its frozen progress id — a cleared Lupus would vanish';
      }
      return null;
    });

  /* ---- NAV — a band caption cannot run off the board ----
     'Regiō VII · Lītus' overflowed the right edge of a 375 px phone the
     first time, because the width estimate assumed the desktop serif it was
     measured in. The estimate is pessimistic now; this row holds it there
     against every caption the manifest can actually produce. */
  check('NAV-BAND', 'no region title band can overflow the board at any track length',
    function () {
      if (!window.CONTENT_MANIFEST) { return 'the manifest is not loaded'; }
      var tracks = ['fabulae', 'historia', 'aeneis'], t, i;
      for (t = 0; t < tracks.length; t++) {
        var tr = tracks[t];
        var html = WorldMap.render(navBoard(tr));
        var doc = new DOMParser().parseFromString(
          html.replace(/^[\s\S]*?<svg/, '<svg').replace(/<\/svg>[\s\S]*$/, '</svg>'),
          'image/svg+xml');
        var texts = doc.getElementsByTagName('text'), k;
        for (k = 0; k < texts.length; k++) {
          var x = parseFloat(texts[k].getAttribute('x'));
          var tl = texts[k].getAttribute('textLength');
          if (!tl) { continue; }
          /* a squeezed caption is pinned to its box; that box must sit
             inside the 600-unit board with the cartouche's own margin */
          if (x - parseFloat(tl) / 2 < 40 || x + parseFloat(tl) / 2 > 560) {
            return tr + ': a pinned caption spans past the board edge (' +
                   texts[k].textContent + ')';
          }
        }
        /* and the longest caption the corpus holds still fits unsqueezed or
           is squeezed rather than allowed to run */
        var es = CONTENT.regionEntries(tr);
        for (i = 0; i < es.length; i++) {
          var cap = 'Regiō ' + CONTENT.roman(i + 1) + ' · ' + CONTENT.regionTitulus(tr, es[i].id);
          if (html.indexOf('>' + cap.replace(/&/g, '&amp;') + '<') < 0) {
            return tr + ': the band for ' + es[i].id + ' does not carry its caption';
          }
        }
      }
      return null;
    });

  /* ---- NAV — the app is actually WIRED to all of it ----
     The four rows above prove the primitives. This one proves js/app.js
     calls them: a perfect nextNodeAfterBoss() that nobody invokes leaves
     the learner exactly as stranded as before. */
  checkAsync('NAV-WIRING', 'js/app.js advances the map node after a boss clear and builds a row per region',
    function (done) {
      if (!SERVED) { done(null); return; }
      fetchText('../js/app.js', function (err, src) {
        if (err) { done('could not read js/app.js: ' + err); return; }
        if (!/function\s+advanceAfterBoss/.test(src)) {
          return done('advanceAfterBoss is gone — nothing moves the learner off the summit');
        }
        if (!/CONTENT\.nextNodeAfterBoss\(/.test(src)) {
          return done('advanceAfterBoss no longer asks CONTENT for the next region');
        }
        if (!/showBossResult[\s\S]{0,900}advanceAfterBoss\(/.test(src)) {
          return done('the victory screen no longer calls advanceAfterBoss');
        }
        if (!/function\s+regionIndexHtml/.test(src) || !/model\.segments\.length/.test(src)) {
          return done('the region index no longer walks the whole track');
        }
        if (!/function\s+trackModel/.test(src) || !/CONTENT\.regionEntries\(/.test(src)) {
          return done('the map model no longer reads every region of the track');
        }
        /* the old single-region model must not come back */
        if (/function\s+mapModel\s*\(/.test(src)) {
          return done('mapModel() is back — the board is one region again');
        }
        return done(null);
      });
    });

  /* ---- POLISH-QASEED ----
     tests/qa.html seeded "everything finished" from three HAND-WRITTEN id
     ranges. Every content wave made them stale, and a stale range does not
     error: the boss node just stays locked and the screenshot quietly shows a
     padlock where the boss should be. The seed reads the manifest now. */
  checkAsync('POLISH-QASEED', 'qa.html seeds completion from CONTENT_MANIFEST, not from hard-coded ranges',
    function (done) {
      if (!SERVED) { done(null); return; }
      withFile('../tests/qa.html', done, function (html) {
        if (html.indexOf('CONTENT_MANIFEST') < 0 || html.indexOf('allCapsDone') < 0) {
          done('the seed no longer derives the completed map from the manifest');
          return;
        }
        /* the manifest must be loaded BEFORE the seed can read it, and exactly once */
        var tags = html.match(/<script src="content\/manifest\.js"[^>]*>/g) || [];
        if (tags.length !== 1) { done('expected exactly one manifest.js tag, found ' + tags.length); return; }
        if (/defer/.test(tags[0])) { done('manifest.js is deferred again, so the seed runs before it exists'); return; }
        if (html.indexOf(tags[0]) > html.indexOf('seed BEFORE storage.js')) {
          done('manifest.js loads AFTER the seed script');
          return;
        }
        /* the ranges that went stale must not creep back */
        if (/for\s*\([^)]*\bci\s*<=\s*\d+/.test(html) || /'f'\s*\+\s*fi/.test(html)) {
          done('a hand-written capitulum range is back in the seed');
          return;
        }
        done(null);
      });
    });

  /* ---- POLISH-OPTROW ----
     A SONUS question offers up to four picture tiles at 108 px each: 460 px
     of tiles in a 343 px column at 375, so the row wrapped and orphaned the
     last tile, and the third one sat within 7 px of the right edge. The tile
     art is capped by the viewport under 480 px so all four fit one row. */
  checkAsync('POLISH-OPTROW', 'picture options shrink with the viewport so four fit one row on a phone',
    function (done) {
      if (!SERVED) { done(null); return; }
      withFile('../css/styles.css', done, function (css) {
        var m = /@media\s*\(max-width:\s*480px\)\s*\{([\s\S]*?)\n\}/.exec(css);
        if (!m) { done('the <=480px block that caps the option thumbnails is gone'); return; }
        var block = m[1];
        if (!/\.emoji-opt \.scn-thumb\s*\{[^}]*width:\s*\d+vw/.test(block)) {
          done('.emoji-opt .scn-thumb is no longer sized in vw, so four tiles cannot fit');
          return;
        }
        if (!/max-width:\s*72px/.test(block)) {
          done('the vw thumbnail has no 72px cap, so it grows past the desktop size');
          return;
        }
        /* The arithmetic the fix rests on, recomputed from the SHIPPED
           numbers: four tiles plus three gaps must fit the content column at
           the narrowest width the app supports (360px). Every term is parsed
           out of the block, so nudging any of them re-runs the sum instead of
           quietly invalidating this row. */
        function rem(re, fallback) {
          var m = re.exec(block);
          return m ? parseFloat(m[1]) * 16 : fallback;
        }
        var vw = parseFloat(/width:\s*([\d.]+)vw/.exec(block)[1]);
        var thumb = 360 * vw / 100;
        var padX = rem(/\.emoji-opt\s*\{[^}]*padding:\s*[\d.]+rem\s+([\d.]+)rem/, 16);
        var gap = rem(/\.opt-row\s*\{[^}]*gap:\s*([\d.]+)rem/, 9.6);
        var border = 4;                /* .opt is 2px each side */
        var rowW = 4 * (thumb + 2 * padX + border) + 3 * gap;
        var column = 360 - 32;         /* .screen padding, both sides */
        done(rowW <= column ? null :
          'four tiles need ' + rowW.toFixed(0) + 'px in a ' + column + 'px column at 360px');
      });
    });

  /* ================= CHECK 9 =================
     INT pass 6 — bubble auto-fit and the crowd seed.

     bubble() is private to scenes.js, so both bubble rows drive it the way the
     app does: through Scenes.render() with a one-bubble spec, and read the
     <text> element back out of the emitted string. That is the shipped path,
     not a restatement of it. */

  function bubbleText(b) {
    var s = Scenes.render({ bg: 'plain', items: [], bubbles: [b] });
    var a = s.indexOf('<text');
    return (a < 0) ? '' : s.substring(a, s.indexOf('</text>') + 7);
  }

  /* ---- INT6-FIT ----
     21 of the 1088 shipped bubbles set WIDER than the box drawn behind them
     — worst of all this one, 'Revertere in terram patrum tuōrum', which laid
     out at 186px inside a 148px rect and ran out over the artwork on both
     sides. SVG does not wrap text, so bubble() estimates the advance and,
     when it overruns, scales the font down and pins the rest with textLength.
     This is the SHIPPED spec, character for character. */
  check('INT6-FIT', 'a bubble too narrow for its Latin shrinks the font and pins it with textLength',
    function () {
      var t = bubbleText({ x: 176, y: 116, w: 148, h: 46, fs: 10,
                           text: 'Revertere in terram patrum tuōrum',
                           kind: 'speech', tail: 'right' });
      if (t.indexOf('textLength="138"') < 0) {
        return 'no textLength="138" (w 148 minus the 10px inner margin): ' + t.substring(0, 150);
      }
      if (t.indexOf('lengthAdjust="spacingAndGlyphs"') < 0) {
        return 'textLength without lengthAdjust="spacingAndGlyphs" collapses the word gaps ' +
               'instead of condensing the glyphs';
      }
      var m = /font-size="([\d.]+)"/.exec(t);
      if (!m) { return 'no font-size on the emitted <text>'; }
      var fs = parseFloat(m[1]);
      if (!(fs < 10)) { return 'font-size was not reduced from the authored 10: ' + fs; }
      if (fs < 7) { return 'font-size ' + fs + ' is below the 7px readability floor'; }
      return null;
    });

  /* ---- INT6-FITNOOP ----
     The other half of that fix, and the half that can rot silently: a bubble
     whose text ALREADY fits must come out of bubble() exactly as it did
     before the auto-fit existed — no textLength, no rescaled font, not one
     byte moved. The expected string below is the PRE-FIX output written out
     in full, so a future tweak to the estimate that starts firing on short
     emoji bubbles turns this row red instead of silently condensing 1000
     bubbles that were never broken. */
  check('INT6-FITNOOP', 'a short emoji bubble is byte-identical to its pre-auto-fit markup',
    function () {
      var t = bubbleText({ x: 62, y: 88, w: 54, h: 40, text: '😠',
                           kind: 'thought', tail: 'right', fs: 20 });
      var want = '<text x="62" y="94.66666666666667" text-anchor="middle" font-size="20"' +
                 ' font-family="Palatino, Georgia, serif" fill="#3a2417" font-weight="bold">' +
                 '😠</text>';
      return (t === want) ? null : 'emitted   ' + t + '\nexpected  ' + want;
    });

  /* ---- INT6-CROWD ----
     crowdGroup declared `pose` and `seed` in its header from the first commit
     and read NEITHER, so historia-l7's three side-by-side crowds — authored
     with seeds 7 and 13 precisely so they would not be clones — drew as three
     identical groups, and the 39 content items asking the crowd to point or
     raise its arms were silently ignored. Both keys are live now. The hard
     part is the promise attached to it: a call with neither key must emit what
     it emitted before, for all 321 unseeded crowds in the book. */
  check('INT6-CROWD', 'an unseeded, unposed crowdGroup is unchanged, and pose now reaches its members',
    function () {
      function crowd(o) {
        var it = { t: 'crowdGroup', x: 200, y: Scenes.GROUND };
        var k;
        for (k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) { it[k] = o[k]; } }
        return Scenes.render({ bg: 'plain', items: [it] });
      }
      /* the authored slot offsets, emitted verbatim when nothing jitters them */
      var base = crowd({ n: 5 });
      var slots = ['translate(0,', 'translate(-26,', 'translate(25,',
                   'translate(-46,', 'translate(45,'];
      var i;
      for (i = 0; i < slots.length; i++) {
        if (base.indexOf(slots[i]) < 0) {
          return 'default n=5 no longer places a figure at the authored slot ' + slots[i] +
                 ') — the jitter is firing without a seed';
        }
      }
      /* the authored stand/point alternation, and the authored robe rotation
         (offset 0) which puts CROWD_ROBES[1] on the first figure drawn */
      if (crowd({ n: 4 }) !== crowd({ n: 4 })) { return 'crowdGroup is not a pure function of its opts'; }
      if (crowd({ n: 3, pose: 'arms-up' }) === crowd({ n: 3 })) {
        return 'pose still does not reach the members — the key is dead again';
      }
      if (crowd({ n: 3, pose: 'walk' }) === crowd({ n: 3, pose: 'arms-up' })) {
        return 'every pose renders the same figure';
      }
      /* person() owns the pose vocabulary; an unknown one must fall back
         there rather than in a second list here that could drift */
      if (crowd({ n: 3, pose: 'nonsuch' }) !== crowd({ n: 3, pose: 'stand' })) {
        return 'an unknown pose is no longer falling back to stand in person()';
      }
      return null;
    });

  /* ---- INT6-CROWDSEED ----
     The seed must vary the crowd and must NEVER vary a redraw of it: scenes.js
     caches sprites and this suite compares emitted strings, so a Math.random
     crowd would make a cached sprite disagree with the scene it was cut from.
     The count spread is checked across small integers on purpose — content
     seeds by hand with 5, 7, 9, 13, and a generator used raw (no warm-up)
     hands every one of those the same crowd of three. */
  check('INT6-CROWDSEED', 'seeds vary the crowd deterministically, including small hand-typed ones',
    function () {
      function crowd(o) {

    function () {

            currently produce, must all end up inside the tile's top face. */

        if (f.w > LIMIT + 0.01) {

            }
          }
          if (caps < 100 || sets < 400) {
            done('swept only ' + caps + ' capitula / ' + sets + ' option sets — the ' +
                 'walk stopped matching the content shape'); return;
          }
          if (critical.length) {
            done(critical.length + ' CRITICAL: ' + critical.join(' | ')); return;
          }
          done(null, caps + ' capitula, ' + sets + ' option sets, 0 critical, ' +
                     warns + ' warn (the runtime flip covers these)');
        }

        for (i = 0; i < want.length; i++) {
          (function (w) {
            if (CONTENT.region(w.track, w.region)) { loaded(); return; }
            var src = '../content/' + w.track + '-' + w.region + '.js';
            var el = document.createElement('script');
            el.src = src; el.async = false;
            el.onload = loaded;
            el.onerror = function () { failedSrc = src; loaded(); };
            document.head.appendChild(el);
          }(want[i]));
        }
      };
      mx.send(null);
    });

  /* The two cases the owner named by hand. They are asserted as BEHAVIOUR —
     "asking this word in this capitulum does not put the learner in front of
     three pictures they cannot tell apart" — not as a scene literal, so a
     future re-illustration is free to satisfy them any way it likes. */
  checkAsync('CLAR', "the owner's cases: h2 `Adam` and l1 h1 `terra` are answerable",
    function (done) {
      if (!SERVED) { done(null); return; }
      var el = document.createElement('script');
      el.src = '../content/historia-l1.js'; el.async = false;
      el.onerror = function () { done('historia-l1.js did not load'); };
      el.onload = function () {
        var reg = CONTENT.region('historia', 'l1');
        if (!reg) { done('historia/l1 registered nothing'); return; }
        var report = [], bad = [];
        var cases = [['h2', 'Adam'], ['h1', 'terra']];
        var ci, c, cap, pool, target, i, j, set, total, safe;
        for (ci = 0; ci < cases.length; ci++) {
          c = cases[ci];
          cap = CONTENT.capitulum(reg, c[0]);
          if (!cap) { bad.push(c[0] + ' is gone'); continue; }
          pool = CHIP.visuals(cap);
          target = null;
          for (i = 0; i < pool.length; i++) { if (pool[i].la === c[1]) { target = pool[i]; } }
          if (!target) { bad.push(c[1] + ' is no longer in ' + c[0] + "'s vocabulary"); continue; }
          /* EVERY three-option set the quiz can build around this word: each
             must either be visually distinct or be caught by the flip. There
             is no third outcome — that is the whole claim. */
          total = 0; safe = 0;
          for (i = 0; i < pool.length; i++) {
            if (pool[i].la === c[1]) { continue; }
            for (j = i + 1; j < pool.length; j++) {
              if (pool[j].la === c[1]) { continue; }
              set = [target, pool[i], pool[j]];
              total++;
              if (CHIP.optionAmbiguous(set, c[1]) || CHIP.optionsDistinct(set)) { safe++; }
            }
          }
          if (!total) { bad.push(c[0] + '/' + c[1] + ' has no distractors to test'); continue; }
          if (safe !== total) {
            bad.push(c[0] + '/' + c[1] + ': ' + (total - safe) + ' of ' + total +
                     ' option sets are neither distinct nor flipped');
          }
          report.push(c[0] + '/' + c[1] + ' ' + total + ' sets ok');
        }
        /* `Adam` is the named case and it is the strong one: his card shares
           the garden with every other card in h2, so EVERY set flips. */
        cap = CONTENT.capitulum(reg, 'h2');
        pool = CHIP.visuals(cap);
        target = null;
        for (i = 0; i < pool.length; i++) { if (pool[i].la === 'Adam') { target = pool[i]; } }
        if (target) {
          for (i = 0; i < pool.length; i++) {
            if (pool[i].la === 'Adam') { continue; }
            for (j = i + 1; j < pool.length; j++) {
              if (pool[j].la === 'Adam') { continue; }
              if (!CHIP.optionAmbiguous([target, pool[i], pool[j]], 'Adam')) {
                bad.push('an Adam set against ' + pool[i].la + '/' + pool[j].la +
                         ' was left as three same-garden pictures');
              }
            }
          }
        }
        done(bad.length ? bad.join(' | ') : null, report.join('; '));
      };
      document.head.appendChild(el);
    });

  /* The phone layout the ruling required, read out of the shipped CSS: the
     chips are a 2-column grid at phone width, the art is at least 96px, and
     the button itself clears the 44px touch-target floor. */
  checkAsync('CLAR', 'phone picture chips are a 2-column grid at >=96px with 44px targets',
    function (done) {
      if (!SERVED) { done(null); return; }
      withFile('../css/styles.css', done, function (css) {
        var picks = css.indexOf('.opt-row.picks');
        if (picks < 0) { return done('no .opt-row.picks rule — the picture rows have no phone layout'); }
        if (css.indexOf('grid-template-columns: 1fr 1fr') < 0) {
          return done('the phone picture row is not a 2-column grid');
        }
        if (css.indexOf('min-width: 96px') < 0 || css.indexOf('min-height: 96px') < 0) {
          return done('the phone chip art has no 96px floor — this is the size complaint');
        }
        if (css.indexOf('max-width: 140px') < 0) {
          return done('the phone chip art has no 140px cap and can overflow a 2-column row');
        }
        if (!/\.opt-row\.picks \.opt \{[^}]*min-height: 44px/.test(css)) {
          return done('picture options do not declare the 44px touch-target minimum');
        }
        /* the old shrink-to-fit rule must not win inside the grid, or the art
           goes back to 15vw = 56px at 375 */
        if (css.indexOf('.opt-row.picks .emoji-opt .scn-thumb') < 0) {
          return done('the grid does not override the 15vw shrink rule, so the ' +
                      'chips are still fingernail-sized on a phone');
        }
        return done(null);
      });
    });

  /* app.js cannot be executed in this page (it boots itself against the app
     shell), so the two engine claims about it are asserted against its BYTES,
     which is this file's established way of guarding it. */
  checkAsync('CLAR', 'app.js draws chips through the crop rule and can flip a question',
    function (done) {
      if (!SERVED) { done(null); return; }
      withFile('../js/app.js', done, function (src) {
        var vf = src.indexOf('function visualFor');
        if (vf < 0) { return done('visualFor is gone — there is no shared chip renderer'); }
        var body = src.slice(vf, vf + 900);
        if (body.indexOf('CHIP.soloActor') < 0) {
          return done('visualFor no longer asks CHIP.soloActor, so chips are whole ' +
                      'mini-scenes again and the linter is guarding nothing');
        }
        if (body.indexOf('Scenes.sprite') < 0) {
          return done('visualFor never reaches Scenes.sprite — nothing is actually cropped');
        }
        if (src.indexOf('CHIP.optionAmbiguous') < 0) {
          return done('the verba quiz no longer consults the linter, so an ' +
                      'unanswerable question can reach a learner');
        }
        if (src.indexOf('function askPicture') < 0) {
          return done('the picture→word fallback is gone');
        }
        /* the flipped direction asks "Quod verbum?" and the picture-choice
           direction must NOT, or both read as the same question */
        if (src.indexOf('UI.quaeImago') < 0) {
          return done('the picture-choice direction still borrows the word prompt');
        }
        /* every picture row must be a `picks` row or it gets no phone grid */
        var rows = src.match(/class="opt-row[^"]*"/g) || [];
        var picks = 0, k;
        for (k = 0; k < rows.length; k++) { if (rows[k].indexOf('picks') >= 0) { picks++; } }
        if (picks < 4) {
          return done('only ' + picks + ' picture rows are marked `picks` — the verba ' +
                      'quiz, sonus, the boss quiz and the refill all need the phone grid');
        }
        return done(null);
      });
    });

  runEngineQueue();      /* start the serialized engine tests */
  runNetQueue();         /* start the serialized offline-queue tests */
  finish();
}());
</script>
</body>
</html>
